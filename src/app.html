<!doctype html>
<html lang="en" class="no-scrollbar">

<head>
	<meta charset="utf-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<link rel="manifest" href="/manifest.json" />
	<!-- Slightly darker than --background (#fef8f3): Chrome Android ignores theme-color when too light (contrast). https://stackoverflow.com/questions/55514350/theme-color-meta-tags-not-working-with-specific-color -->
	<meta name="theme-color" content="#f5f0ea" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#1B120A" media="(prefers-color-scheme: dark)" />
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="evn" />

	<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="icon" href="/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
