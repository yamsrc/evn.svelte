nudge:
  prompt: >-
    Бажаєте одразу дізнаватися про такі події? Увімкніть сповіщення, щоб
    отримувати їх вчасно прямо на свій пристрій.
  button: Увімкнути сповіщення
  dismiss: Закрити
  dismissed: >-
    Не хвилюйтеся — ви можете ввімкнути сповіщення у налаштуваннях профілю в
    будь-який час.
