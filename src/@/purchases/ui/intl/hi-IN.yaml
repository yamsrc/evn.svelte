paywall:
  title: Evnly प्रीमियम
  offer:
    headline: सब्सक्रिप्शन के साथ Evn और ज़्यादा कमाल!
    promo: सीमित समय के लिए, प्रीमियम पूरी तरह से मुफ्त है।
    cta: अपना फ्री ट्रायल शुरू करें
    disclaimer: नि:शुल्क ट्रायल केवल योग्य प्रथम बार ग्राहकों के लिए उपलब्ध है। चार्ज से बचने के लिए ट्रायल समाप्त होने से 24 घंटे पहले रद्द करें। नि:शुल्क ट्रायल के बाद आवर्तक बिलिंग स्वचालित रूप से शुरू हो जाएगी, कभी भी रद्द करें।
    footnote: "* एक प्रीमियम उपयोगकर्ता सभी प्रतिभागियों के लिए आइटम मार्किंग सक्षम करता है। रोमांचों में केवल रसीद पाठ सेव किया जाता है (कोई दृश्य विभाजन नहीं)।"
    buy: Evnly Premium खरीदो
    trial:
      comment: |-
        !js
        (price) => `7 दिन मुफ्त, फिर ${price}/वर्ष`
      cta: अपनी फ्री ट्रायल शुरू करो
    subscribe_monthly: |-
      !js
      (price) => `${price} प्रति माह पर सब्सक्राइब करो`
  complete:
    thanks: Envly Premium की सदस्यता लेने के लिए धन्यवाद
    avatarNote: अब से, अन्य Evnly उपयोगकर्ता आपका अवतार इस तरह देखेंगे।
    featuresNote: इसके अलावा, अब आप अपने प्रोफ़ाइल में इंटरफ़ेस को और भी कस्टमाइज़ कर सकते हैं, रसीदें स्कैन और पहचान सकते हैं, और भी बहुत कुछ कर सकते हैं।
  free:
    cta: प्रीमियम का आनंद लो
  disclaimers:
    apple: फ्री ट्रायल सिर्फ योग्य पहले बार के सब्सक्राइबर्स के लिए उपलब्ध है। चार्ज से बचने के लिए ट्रायल खत्म होने से 24 घंटे पहले कैंसल करें। अपनी सदस्यता को Apple ID अकाउंट सेटिंग्स में मैनेज या कैंसल कर सकते हो।
products:
  yearly:
    title: वार्षिक
    description: |-
      !js
      (value) => `${value} का सालाना भुगतान`
  monthly:
    title: मासिक
    description: लचीलापन
permonth: |-
  !js
  (value) => `${value} प्रति माह`
trial: |-
  !js
  (period) => `${period} फ्री`
disclaimers:
  trial: फ्री ट्रायल योग्य पहले बार के सब्सक्राइबर के लिए उपलब्ध है।
  apple_account: खरीद की पुष्टि करते ही भुगतान तुम्हारे Apple ID खाते से लिया जाएगा।
  apple_yearly: |-
    !js
    (price) => `सब्सक्रिप्शन अपने आप हर साल ${price} में रिन्यू होगा, जब तक कि इसे मौजूदा अवधि के खत्म होने से कम से कम 24 घंटे पहले कैंसिल न किया जाए।`
  apple_manage: तुम अपने Apple ID अकाउंट सेटिंग्स में अपनी सब्स्क्रिप्शन मैनेज या कैंसिल कर सकते हो।
  apple_monthly: |-
    !js
    (price) => `सब्सक्रिप्शन हर महीने ${price} में अपने आप रिन्यू हो जाएगा, जब तक कि तुम इसे मौजूदा अवधि की समाप्ति से कम से कम 24 घंटे पहले कैंसल नहीं करते हो।`
  stripe_account: तुम कभी भी अकाउंट सेटिंग्स से रद्द कर सकते हो।
  stripe_monthly: |-
    !js
    (price) => `सब्सक्रिप्शन अपने-आप हर महीने ${price} में रीन्यू होगा, जब तक कैंसल न करो।`
  stripe_yearly: |-
    !js
    (price) => `सब्सक्रिप्शन अपने आप ${price}/साल के लिए रिन्यू हो जाएगा, जब तक तुम कैंसिल नहीं करते।`
  google_account: खरीद की पुष्टि करते ही आपके Google Play खाते से भुगतान लिया जाएगा।
  google_manage: तुम अपने Google Play अकाउंट सेटिंग्स में अपनी सब्सक्रिप्शन को मैनेज या कैंसिल कर सकते हो।
  google_yearly: |-
    !js
    (price) => `सब्सक्रिप्शन अपने-आप ${price}/साल के लिए रिन्यू हो जाएगा, जब तक कि तुम इसे मौजूदा पीरियड खत्म होने से कम से कम 24 घंटे पहले कैंसिल नहीं कर देते।`
  google_monthly: |-
    !js
    (price) => `सब्सक्रिप्शन अपने-आप ${price}/महीना के हिसाब से रिन्यू होता है, जब तक कि उसे करंट पीरियड के खत्म होने से कम से कम 24 घंटे पहले कैंसिल न कर दें।`
restore:
  label: खरीदारी बहाल करें
subscription:
  active: प्रीमियम सक्रिय है
  expires: |-
    !js
    (date, gender) => { if (gender === "he") return `${date} को समाप्त होगा`; if (gender === "she") return `${date} को समाप्त होगी`; return `${date} को समाप्त होगा/होगी`; }
  manage: प्रबंधित करें
