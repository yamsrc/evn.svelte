paywall:
  title: Evnly Premium
  offer:
    headline: Evn ancora meglio con l’abbonamento!
    promo: Per un periodo limitato, Premium è completamente gratuito.
    cta: Inizia la prova gratuita
    disclaimer: >-
      Prova gratuita disponibile solo per nuovi abbonati idonei. Cancella almeno
      24 ore prima della fine della prova per evitare addebiti. Dopo la prova
      gratuita, la fatturazione sarà ricorrente; è possibile annullare in
      qualsiasi momento.
    footnote: >-
      * Un utente Premium consente la marcatura degli oggetti per tutti i
      partecipanti. Nelle avventure, viene salvato solo il testo della ricevuta
      (nessuna suddivisione visiva).
    buy: Acquista Evnly Premium
    trial:
      comment: |-
        !js
        (price) => `7 giorni gratis, poi ${price}/anno`
      cta: Inizia la tua prova gratuita
    subscribe_monthly: |-
      !js
      (price) => `Abbonati a ${price} al mese`
  complete:
    thanks: Grazie per esserti abbonato a Envly Premium
    avatarNote: D’ora in poi, gli altri utenti di Evnly vedranno il tuo avatar così.
    featuresNote: >-
      Inoltre, da ora puoi personalizzare ulteriormente l’interfaccia nel tuo
      profilo, scansionare e riconoscere ricevute e molto altro.
  free:
    cta: Goditi Premium
  disclaimers:
    apple: >-
      La prova gratuita è disponibile solo per i nuovi iscritti idonei. Cancella
      almeno 24 ore prima della fine della prova per evitare addebiti. Puoi
      gestire o annullare il tuo abbonamento dalle impostazioni dell’account
      Apple ID.
