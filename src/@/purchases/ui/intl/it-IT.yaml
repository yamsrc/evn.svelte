  apple_yearly: >-
    !js

    (price) => `L'abbonamento si rinnova automaticamente per ${price}/anno, a
    meno che tu non lo cancelli almeno 24 ore prima della fine del periodo
    attuale.`
  apple_manage: >-
    Puoi gestire o annullare l’abbonamento dalle impostazioni del tuo account
    Apple ID.
  apple_monthly: >-
    !js

    (price) => `L’abbonamento si rinnova automaticamente a ${price}/mese a meno
    che tu non lo annulli almeno 24 ore prima della fine del periodo attuale.`
  stripe_account: La tua carta verrà addebitata quando confermi l’acquisto.
  stripe_monthly: >-
    !js

    (price) => `L’abbonamento si rinnova automaticamente a ${price}/mese, a meno
    che tu non lo annulli.`
  stripe_yearly: >-
    !js

    (price) => `L’abbonamento si rinnova automaticamente a ${price} all’anno, a
    meno che tu non lo annulli.`
