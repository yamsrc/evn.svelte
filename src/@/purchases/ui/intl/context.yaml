context: Mount 'purchases' context
inputs:
  paywall:
    title:
      input: Evnly Premium
      context: paywall h1
    offer:
      headline:
        input: Evn better with subscription!
        context: Play on words - Evn is action of spliting (app purpose)
      promo:
        input: For a limited time, Premium is completely free.
      cta:
        input: Start your free trial
        context: button
      disclaimer:
        input: Free trial available only to eligible first time subscribers. Cancel 24 hours before trial ends to avoid charge. Recurring billing after free trial, cancel anytime.
        context: legal
      footnote:
        input: "* One Premium user enables item marking for all participants. In adventures, only receipt text is saved (no visual split)."
        context: asterisk note
      trial:
        input: 7-day free, then {price}/year
    complete:
      thanks:
        input: Thank you for subscribing to Envly Premium
      avatarNote:
        input: For a start, other Evnly users from now on will see your avatar like this.
      featuresNote:
        input: Plus, from now on you can further customize the interface in your profile, scan and recognize receipts and more.
    free:
      cta:
        input: Enjoiy Premium
        context: button label, инфинитив (начальная форма)
  products:
    yearly:
      title:
        input: Yearly
        context: payment option title
      description:
        input: Annual payment of {value}
        context: payment option description, a function
    monthly:
      title:
        input: Monthly
        context: payment option title
      description:
        input: Flexible
        context: payment option description
  permonth:
    input: "{value} per month"
    context: price per month, a function
  trial:
    input: "{period} free"
    context: trial period, a function that will accept periods like 1 day, 2 weeks etc
