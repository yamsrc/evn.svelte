    context: price per month, a function
  trial:
    input: "{period} free"
    context: trial period, a function that will accept periods like 1 day, 2 weeks etc
  disclaimers:
    trial:
      input: Free trial is available to eligible first-time subscribers.
    apple_account:
      input: Payment will be charged to your Apple ID account at confirmation of purchase.
    apple_yearly:
      input: Subscription automatically renews for {price}/year unless canceled at least 24 hours before the end of the current period.
      context: a function accepting price
    apple_manage:
      input: You can manage or cancel your subscription in your Apple ID account settings.
    apple_monthly:
      input: Subscription automatically renews for {price}/month unless canceled at least 24 hours before the end of the current period.
      context: a function accepting price
  restore:
