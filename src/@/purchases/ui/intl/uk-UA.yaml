paywall:
  title: Evnly Premium
  offer:
    headline: Evn ще крутіше з підпискою!
    promo: >-
      Тільки протягом обмеженого часу Evnly Premium доступний абсолютно
      безкоштовно.
    cta: Почати безкоштовний пробний період
    disclaimer: >-
      Безкоштовна пробна версія доступна лише для нових відповідних підписників.
      Скасуйте за 24 години до завершення пробного періоду, щоб уникнути
      стягнення плати. Після закінчення безкоштовного періоду діє автоматична
      підписка — скасувати можна будь-коли.
    footnote: >-
      * Один користувач із підпискою Premium дає змогу позначати елементи для
      всіх учасників. У пригодах зберігається лише текст чеку (без візуального
      поділу).
    trial: |-
      !js
      (price) => `7 днів безкоштовно, потім ${price} на рік`
  complete:
    thanks: Дякуємо за підписку на Envly Premium
    avatarNote: Відтепер інші користувачі Evnly бачитимуть ваш аватар ось так.
    featuresNote: >-
      До того ж, відтепер ви можете ще більше налаштовувати інтерфейс у своєму
      профілі, сканувати й розпізнавати чеки та багато іншого.
