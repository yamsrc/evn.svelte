paywall:
  title: Evnly Premium
  offer:
    headline: Evn ще крутіше з підпискою!
    promo: Преміум зараз повністю безкоштовний — тільки на короткий час!
    cta: Почати безкоштовний пробний період
    disclaimer: Безкоштовна пробна версія доступна лише для нових відповідних підписників. Скасуйте за 24 години до завершення пробного періоду, щоб уникнути стягнення плати. Після закінчення безкоштовного періоду діє автоматична підписка — скасувати можна будь-коли.
    footnote: "* Один користувач із підпискою Premium дає змогу позначати елементи для всіх учасників. У пригодах зберігається лише текст чеку (без візуального поділу)."
    buy: Купити Evnly Premium
    trial:
      comment: |-
        !js
        (price) => `7 днів безкоштовно, потім ${price} на рік`
      cta: Почни безкоштовну пробну версію
    subscribe_monthly: |-
      !js
      (price) => `Підпишись за ${price} на місяць`
  complete:
    thanks: Дякуємо за підписку на Envly Premium
    avatarNote: Відтепер інші користувачі Evnly бачитимуть ваш аватар ось так.
    featuresNote: До того ж, відтепер ви можете ще більше налаштовувати інтерфейс у своєму профілі, сканувати й розпізнавати чеки та багато іншого.
  free:
    cta: Насолоджуйся Premium
  disclaimers:
    apple: Безкоштовна пробна версія доступна лише новим, відповідним підписникам. Щоб уникнути списання коштів, скасуй підписку за 24 години до завершення пробного періоду. Керувати підпискою можна в налаштуваннях облікового запису Apple ID.
products:
  yearly:
    title: Щорічно
    description: |-
      !js
      (value) => `Річна оплата ${value}`
  monthly:
    title: Щомісяця
    description: Гнучко
permonth: |-
  !js
  (value) => `${value} на місяць`
trial: |-
  !js
  (period) => `${period} безкоштовно`
disclaimers:
  trial: Безкоштовна пробна версія доступна для нових підписників, які відповідають вимогам.
  apple_account: Платіж буде знято з твого акаунта Apple ID після підтвердження покупки.
  apple_yearly: |-
    !js
    (price) => `Підписка автоматично поновлюється за ${price}/рік, якщо ти не скасуєш її принаймні за 24 години до кінця поточного періоду.`
  apple_manage: Ти можеш керувати підпискою або скасувати її в налаштуваннях свого Apple ID.
  apple_monthly: |-
    !js
    (price) => `Підписка автоматично подовжується за ${price}/місяць, якщо ти не скасуєш її щонайменше за 24 години до кінця поточного періоду.`
  stripe_account: Ти можеш скасувати підписку будь-коли у налаштуваннях акаунта.
  stripe_monthly: |-
    !js
    (price) => `Підписка автоматично поновлюється за ${price}/місяць, якщо не скасувати.`
  stripe_yearly: |-
    !js
    (price) => `Підписка автоматично поновлюється за ${price} на рік, якщо ти її не скасуєш.`
  google_account: Платіж буде списано з твого акаунта Google Play після підтвердження покупки.
  google_manage: Ти можеш керувати чи скасувати підписку в налаштуваннях свого акаунта Google Play.
  google_yearly: |-
    !js
    (price) => `Підписка автоматично оновиться за ${price}/рік, якщо ти не скасуєш її щонайменше за 24 години до кінця поточного періоду.`
  google_monthly: |-
    !js
    (price) => `Підписка автоматично продовжується за ${price}/місяць, якщо ти не скасуєш її мінімум за 24 години до кінця поточного періоду.`
restore:
  label: Відновити покупки
subscription:
  active: Преміум активний
  expires: |-
    !js
    (date, gender) => { if (gender === "he") return `Завершується ${date}`; if (gender === "she") return `Завершується ${date}`; return `Завершується ${date}`; }
  manage: Керувати
