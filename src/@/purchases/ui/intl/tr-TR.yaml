  (period) => `${period} ücretsiz`
disclaimers:
  trial: Uygun ilk kez abone olanlar için ücretsiz deneme mevcut.
  apple_account: Satın alımını onayladığında, ödeme Apple ID hesabına yansıtılacak.
  apple_yearly: >-
    !js

    (price) => `Abonelik, mevcut dönem bitiminden en az 24 saat önce iptal
    edilmezse yılda ${price} karşılığında otomatik olarak yenilenir.`
  apple_manage: Apple ID hesabı ayarlarından aboneliğini yönetebilir veya iptal edebilirsin.
  apple_monthly: >-
    !js

    (price) => `Abonelik, geçerli dönem bitmeden en az 24 saat önce iptal
    etmezsen ${price}/ay olarak otomatik yenilenir.`
