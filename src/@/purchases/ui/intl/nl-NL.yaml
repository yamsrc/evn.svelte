paywall:
  title: Evnly Premium
  offer:
    headline: Evn wordt nog beter met een abonnement!
    promo: Premium is tijdelijk helemaal gratis.
    cta: Begin je gratis proefperiode
    disclaimer: >-
      Gratis proefperiode is alleen beschikbaar voor in aanmerking komende
      nieuwe abonnees. Annuleer minimaal 24 uur voor het einde van de
      proefperiode om kosten te voorkomen. Na de gratis proefperiode vindt
      automatische verlenging plaats; opzeggen kan op elk moment.
    footnote: >-
      * Eén Premium-gebruiker maakt het markeren van items mogelijk voor alle
      deelnemers. In avonturen wordt alleen de tekst van het ontvangstbewijs
      opgeslagen (geen visuele verdeling).
    buy: Evnly Premium kopen
    trial:
      comment: |-
        !js
        (price) => `7 dagen gratis, daarna ${price}/jaar`
      cta: Start je gratis proefperiode
    subscribe_monthly: |-
      !js
      (price) => `Abonneer je voor ${price} per maand`
  complete:
    thanks: Bedankt voor je abonnement op Envly Premium
    avatarNote: Vanaf nu zien andere Evnly-gebruikers jouw avatar er zo uit.
    featuresNote: >-
      Bovendien kun je vanaf nu de interface verder aanpassen in je profiel,
      bonnetjes scannen en herkennen, en meer.
  free:
    cta: Premium genieten
  disclaimers:
    apple: >-
      De gratis proefperiode is alleen beschikbaar voor in aanmerking komende,
      nieuwe abonnees. Annuleer minstens 24 uur voor het einde van de proef om
      kosten te voorkomen. Je kunt je abonnement beheren of opzeggen via je
      Apple ID-accountinstellingen.
products:
  yearly:
    title: Jaarlijks
    description: |-
      !js
      (value) => `Jaarlijkse betaling van ${value}`
  monthly:
