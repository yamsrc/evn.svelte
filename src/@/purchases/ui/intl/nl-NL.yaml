  apple_monthly: >-
    !js

    (price) => `Abonnement wordt automatisch verlengd voor ${price}/maand,
    tenzij je minstens 24 uur voor het einde van de huidige periode opzegt.`
  stripe_account: Je kaart wordt belast zodra je je aankoop bevestigt.
  stripe_monthly: >-
    !js

    (price) => `Je abonnement wordt automatisch verlengd voor ${price} per
    maand, tenzij je opzegt.`
  stripe_yearly: >-
    !js

    (price) => `Abonnement wordt automatisch verlengd voor ${price} per jaar,
