paywall:
  title: Evnly Премиум
  offer:
    headline: Evn становится ещё лучше с подпиской!
    promo: Премиум сейчас полностью бесплатен — только на время!
    cta: Начать бесплатную пробную версию
    disclaimer: >-
      Бесплатная пробная версия доступна только новым подходящим подписчикам.
      Отмените за 24 часа до окончания пробного периода, чтобы избежать оплаты.
      После окончания бесплатного периода списание происходит автоматически, вы
      можете отменить подписку в любое время.
    footnote: >-
      * Один пользователь с подпиской Premium включает возможность пометки
      предметов для всех участников. В приключениях сохраняется только текст
      чека (без визуального разделения).
    buy: Купить Evnly Premium
    trial:
      comment: |-
        !js
        (price) => `7 дней бесплатно, затем ${price} в год`
      cta: Начни бесплатную пробу
    subscribe_monthly: |-
      !js
      (price) => `Подпишись за ${price} в месяц`
  complete:
    thanks: Спасибо за подписку на Envly Premium
    avatarNote: Теперь другие пользователи Evnly будут видеть ваш аватар вот так.
    featuresNote: >-
      Кроме того, теперь вы можете ещё больше настраивать интерфейс в своём
      профиле, сканировать и распознавать чеки и многое другое.
  free:
    cta: Наслаждаться Премиум
  disclaimers:
    apple: >-
      Бесплатная пробная версия только для новых подходящих подписчиков. Чтобы
      не списали деньги, отмени подписку за 24 часа до конца пробного периода.
      Управлять подпиской можно в настройках аккаунта Apple ID.
products:
  yearly:
    title: Ежегодно
    description: |-
      !js
      (value) => `Ежегодный платеж ${value}`
  monthly:
    title: Ежемесячно
    description: Гибко
permonth: |-
  !js
  (value) => `${value} в месяц`
trial: |-
  !js
  (period) => `${period} бесплатно`
disclaimers:
  trial: Бесплатная пробная версия доступна подходящим новым подписчикам.
  apple_account: Платёж спишется с твоего аккаунта Apple ID после подтверждения покупки.
  apple_yearly: >-
    !js

    (price) => `Подписка автоматически продлевается за ${price}/год, если ты не
    отменишь её хотя бы за 24 часа до конца текущего периода.`
  apple_manage: >-
    Ты можешь управлять или отменить свою подписку в настройках аккаунта Apple
    ID.
  apple_monthly: >-
    !js

    (price) => `Подписка автоматически продлевается за ${price}/месяц, если ты
    не отменишь её минимум за 24 часа до конца текущего периода.`
