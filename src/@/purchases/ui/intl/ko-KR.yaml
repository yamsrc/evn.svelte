  !js
  (period) => `${period} 무료`
disclaimers:
  trial: 무료 체험은 자격이 있는 최초 구독자에게 제공돼요.
  apple_account: 구매를 확인하면 결제가 네 Apple ID 계정으로 청구돼.
  apple_yearly: |-
    !js
    (price) => `현재 기간이 끝나기 최소 24시간 전에 취소하지 않으면 구독이 연 ${price}로 자동 갱신돼요.`
  apple_manage: Apple ID 계정 설정에서 구독을 관리하거나 취소할 수 있어.
  apple_monthly: |-
    !js
    (price) => `구독은 매달 ${price}에 자동으로 갱신돼. 현재 기간 종료 24시간 전까지 해지하지 않으면 계속 결제돼.`
