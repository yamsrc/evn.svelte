paywall:
  title: Evnly 프리미엄
  offer:
    headline: 구독하면 Evn이 더 좋아져요!
    promo: 기간 한정으로 프리미엄이 완전히 무료야.
    cta: 무료 체험 시작하기
    disclaimer: >-
      무료 체험은 자격이 있는 최초 구독자에게만 제공됩니다. 요금이 청구되지 않도록 체험 종료 24시간 전에 해지하세요. 무료 체험 후
      반복 결제가 시작되며, 언제든지 해지할 수 있습니다.
    footnote: "* 프리미엄 사용자 한 명이 모든 참여자에게 아이템 표시를 활성화합니다. 모험에서는 영수증 텍스트만 저장되며(시각적 분할 없음)."
    buy: Evnly Premium 구매하기
    trial:
      comment: |-
        !js
        (price) => `7일 무료, 이후 ${price}/연`
      cta: 무료 체험 시작하기
    subscribe_monthly: |-
      !js
      (price) => `한 달에 ${price}로 구독하기`
  complete:
    thanks: Envly Premium을 구독해 주셔서 감사합니다
    avatarNote: 이제부터 다른 Evnly 사용자들은 당신의 아바타를 이렇게 보게 됩니다.
    featuresNote: >-
      또한, 이제부터 프로필에서 인터페이스를 더 세부적으로 맞춤 설정하고, 영수증을 스캔 및 인식하는 등 다양한 기능을 이용하실 수
      있습니다.
  free:
    cta: 프리미엄을 즐기기
  disclaimers:
    apple: >-
      무료 체험은 자격이 되는 최초 가입자만 이용할 수 있어요. 요금이 청구되기 전에 체험 종료 24시간 전에 꼭 구독을 취소하세요.
      Apple ID 계정 설정에서 구독을 관리하거나 취소할 수 있습니다.
products:
  yearly:
    title: 연간
    description: |-
      !js
      (value) => `연간 결제 ${value}`
  monthly:
    title: 매월
    description: 유연함
permonth: |-
  !js
  (value) => `월 ${value}`
