paywall:
  title: إيفنلي بريميوم
  offer:
    headline: حتى أفضل مع الاشتراك!
    promo: لفترة محدودة، بريميوم مجاني بالكامل.
    cta: ابدأ تجربتك المجانية
    disclaimer: >-
      التجربة المجانية متاحة فقط للمشتركين المؤهلين لأول مرة. يجب الإلغاء قبل 24
      ساعة من انتهاء التجربة لتجنب الرسوم. سيتم تفعيل الفوترة التلقائية بعد
      انتهاء الفترة التجريبية المجانية، ويمكنك الإلغاء في أي وقت.
    footnote: >-
      ‏* يتيح مستخدم بريميوم واحد إمكانية تمييز العناصر لجميع المشاركين. في
      المغامرات، يتم حفظ نص الإيصال فقط (بدون عرض مرئي للتقسيم).
    buy: اشترِ Evnly Premium
    trial:
      comment: |-
        !js
        (price) => `مجاني لمدة 7 أيام، ثم ${price} سنويًا`
      cta: ابدأ تجربتك المجانية
    subscribe_monthly: |-
      !js
      (price) => `اشترك مقابل ${price} شهريًا`
  complete:
    thanks: شكرًا لاشتراكك في Envly Premium
    avatarNote: >-
      مبدئيًا، سيرى مستخدمو Evnly الآخرون صورتك الرمزية بهذا الشكل من الآن
      فصاعدًا.
    featuresNote: >-
      بالإضافة إلى ذلك، يمكنك الآن تخصيص الواجهة أكثر في ملفك الشخصي، ومسح
      الإيصالات والتعرف عليها، والمزيد.
  free:
    cta: استمتع بريميوم
  disclaimers:
    apple: >-
      التجربة المجانية متاحة فقط للمشتركين الجدد المؤهلين. يمكنك الإلغاء قبل ٢٤
      ساعة من انتهاء التجربة لتجنب أي رسوم. يمكنك إدارة أو إلغاء اشتراكك من
      إعدادات حساب Apple ID الخاص بك.
  processing:
    title: جارٍ إكمال عملية الشراء الخاصة بك
    note: جارٍ معالجة دفعتك. سيتم تفعيل بريميوم فور تأكيدها.
products:
  yearly:
    title: سنوي
    description: |-
      !js
      (value) => `دفع سنوي بقيمة ${value}`
  monthly:
    title: شهريًا
    description: مرن
permonth: |-
  !js
  (value) => `${value} شهريًا`
trial: |-
  !js
  (period) => `${period} مجانًا`
disclaimers:
  trial: التجربة المجانية متاحة للمشتركين لأول مرة المؤهلين.
  apple_account: سيتم خصم الدفعة من حساب Apple ID الخاص بك عند تأكيد الشراء.
  apple_yearly: >-
    !js

    (price) => `سيتم تجديد الاشتراك تلقائياً بمبلغ ${price} سنوياً ما لم يتم
    الإلغاء قبل 24 ساعة على الأقل من نهاية الفترة الحالية.`
  apple_manage: يمكنك إدارة أو إلغاء اشتراكك من إعدادات حساب Apple ID الخاص بك.
  apple_monthly: >-
    !js

    (price) => `سيتم تجديد الاشتراك تلقائيًا مقابل ${price} شهريًا ما لم يتم
    الإلغاء قبل 24 ساعة على الأقل من نهاية الفترة الحالية.`
  stripe_account: يمكنك الإلغاء في أي وقت من إعدادات الحساب.
  stripe_monthly: >-
    !js

    (price) => `سيتم تجديد الاشتراك تلقائيًا مقابل ${price} شهريًا ما لم يتم
    الإلغاء.`
  stripe_yearly: >-
    !js

    (price) => `سيتم تجديد الاشتراك تلقائيًا مقابل ${price} سنويًا ما لم يتم
    الإلغاء.`
  google_account: سيتم خصم الدفعة من حساب Google Play الخاص بك عند تأكيد الشراء.
  google_manage: يمكنك إدارة أو إلغاء اشتراكك من إعدادات حسابك في Google Play.
  google_yearly: >-
    !js

    (price) => `سيتم تجديد الاشتراك تلقائيًا بـ${price}/سنة ما لم تلغه قبل 24
    ساعة على الأقل من نهاية الفترة الحالية.`
  google_monthly: >-
    !js

    (price) => `سيتم تجديد الاشتراك تلقائيًا مقابل ${price}/شهر إلا إذا ألغيت
    قبل 24 ساعة على الأقل من نهاية الفترة الحالية.`
restore:
  label: استعادة المشتريات
subscription:
  active: الاشتراك المميز مفعل
  expires: >-
    !js

    (date, gender) => { if (gender === "he") return `ينتهي في ${date}`; if
    (gender === "she") return `تنتهي في ${date}`; return `ينتهي/تنتهي في
    ${date}`; }
  manage: إدارة
