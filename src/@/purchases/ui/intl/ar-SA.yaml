paywall:
  title: إيفنلي بريميوم
  offer:
    headline: حتى أفضل مع الاشتراك!
    promo: لفترة محدودة، بريميوم مجاني بالكامل.
    cta: ابدأ تجربتك المجانية
    disclaimer: >-
      التجربة المجانية متاحة فقط للمشتركين المؤهلين لأول مرة. يجب الإلغاء قبل 24
      ساعة من انتهاء التجربة لتجنب الرسوم. سيتم تفعيل الفوترة التلقائية بعد
      انتهاء الفترة التجريبية المجانية، ويمكنك الإلغاء في أي وقت.
    footnote: >-
      ‏* يتيح مستخدم بريميوم واحد إمكانية تمييز العناصر لجميع المشاركين. في
      المغامرات، يتم حفظ نص الإيصال فقط (بدون عرض مرئي للتقسيم).
    trial: |-
      !js
      (price) => `مجاني لمدة 7 أيام، ثم ${price} سنويًا`
  complete:
    thanks: شكرًا لاشتراكك في Envly Premium
    avatarNote: >-
      مبدئيًا، سيرى مستخدمو Evnly الآخرون صورتك الرمزية بهذا الشكل من الآن
      فصاعدًا.
    featuresNote: >-
      بالإضافة إلى ذلك، يمكنك الآن تخصيص الواجهة أكثر في ملفك الشخصي، ومسح
      الإيصالات والتعرف عليها، والمزيد.
  free:
    cta: استمتع بريميوم
