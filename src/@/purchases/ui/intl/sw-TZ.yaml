disclaimers:
  trial: Jaribio la bure linapatikana kwa watumiaji wa kwanza wanaokidhi vigezo.
  apple_account: Malipo yatakatwa kwenye akaunti yako ya Apple ID utakapoidhinisha ununuzi.
  apple_yearly: |-
    !js
    (price) => `Usajili utajirudia moja kwa moja kwa ${price}/mwaka isipokuwa ukighairi angalau saa 24 kabla ya mwisho wa kipindi kilichopo.`
  apple_manage: Unaweza kudhibiti au kughairi usajili wako kwenye mipangilio ya akaunti yako ya Apple ID.
  apple_monthly: |-
    !js
    (price) => `Usajili utafu renewed kwa ${price}/mwezi kiotomatiki, isipokuwa ukighairi angalau saa 24 kabla ya mwisho wa kipindi kilichopo.`
  stripe_account: Unaweza kughairi muda wowote kupitia mipangilio ya akaunti.
  stripe_monthly: |-
    !js
    (price) => `Usajili utakua upya kila mwezi kwa ${price}, isipofutwa.`
  stripe_yearly: |-
    !js
    (price) => `Usajili upya huwa unafanyika moja kwa moja kwa ${price} kwa mwaka isipobatilishwa.`
  google_account: Malipo yatakatwa kutoka kwenye akaunti yako ya Google Play ukithibitisha ununuzi.
  google_manage: Unaweza kudhibiti au kughairi usajili wako kwenye mipangilio ya akaunti yako ya Google Play.
  google_yearly: |-
    !js
    (price) => `Usajili hujiwesha upya kwa ${price}/mwaka isipokuwa ukighairi angalau masaa 24 kabla ya mwisho wa kipindi cha sasa.`
  google_monthly: |-
    !js
    (price) => `Usajili utafanywa upya moja kwa moja kwa ${price}/mwezi isipokuwa ukighairi angalau saa 24 kabla ya mwisho wa kipindi cha sasa.`
