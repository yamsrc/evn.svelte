  note: Wanachama wote wataona jina hili
  info: >-
    Matukio ni kwa wale wanaotaka kugawana gharama sawa, iwe ni safari pamoja,
    bili ya baa, au matumizi ya kawaida ya nyumbani. Madeni kwenye tukio
    hayawekwi kati ya watumiaji mmoja mmoja, bali kati ya wanachama wote
    wanaosaidia kuweka usawa kwenye matumizi.
