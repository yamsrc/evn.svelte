members:
  title: Учасники
  add: Додати учасників
  empty: Тут поки нікого немає. Додайте учасників, щоб розпочати пригоду.
editor:
  cover: Обкладинка
  upload: Виберіть свій варіант
  name: Назва пригоди
  note: Усі учасники побачать це ім'я
  info: >-
    Пригоди створені для тих, хто хоче ділити витрати порівну — чи це спільна
    подорож, рахунок у барі чи просто загальні домашні витрати. Борги в пригоді
    виникають не між окремими користувачами, а між усіма учасниками, щоб кожен
    мав рівні частки.
  settings: Налаштування
  title: Нова пригода
finish:
  archive:
    title: Завершити пригоду
    description: >-
      Архівування пригоди видалить її з екрана нових витрат і перемістить у
      кінець вашого списку пригод.
    button: Архівувати пригоду
  delete:
    title: Видалити пригоду
    description: >-
      Поки що нічого не сталося. Запросіть друзів і додайте витрати, щоб
      розпочати.
    button: |-
      !js
      (title) => `Видалити «${title}»`
expenses:
  title: Витрати
  total: Всього
  paidBy: Сплачено
  paid: Оплачено
spending:
  yours: Ваші витрати
  total: Всього витрачено
me: Я
selector:
  regular: Регулярні витрати
archive:
  header: |-
    !js
    (title, empty) => empty ? `Видалення ${title}` : `Архівування ${title}`
  delete:
    description: У цій пригоді немає витрат, і вона буде видалена
    button: Видалити пригоду
  warning: Архівування пригоди є остаточним і не може бути скасоване.
balance:
  header: "Під час архівування цієї пригоди:"
  merge: Перемістити борги до боргів звичайних учасників
  keep: Залишити борги/баланси в пригоді
archived: Заархівовано
