editor:
  cover: Titelbild
  upload: Wähle selbst
  name: Abenteuername
  note: Alle Mitglieder sehen diesen Namen
  info: >-
    Abenteuer sind für diejenigen, die die Ausgaben gleichmäßig teilen möchten –
    egal ob gemeinsame Reise, Bar-Rechnung oder einfach Haushaltskosten. Die
    Schulden innerhalb eines Abenteuers bestehen nicht zwischen einzelnen
    Nutzern, sondern gegenüber allen Mitgliedern, sodass alle Ausgaben fair
    abgerechnet werden.
  settings: Einstellungen
  title: Neues Abenteuer
