  archive:
    title: Abenteuer abschließen
    description: >-
      Wenn du das Abenteuer archivierst, wird es vom Bildschirm für neue
      Ausgaben entfernt und ans Ende deiner Abenteuerliste verschoben.
    button: Abenteuer archivieren
  delete:
    button: |-
      !js
      (title) => `"${title}" löschen`
