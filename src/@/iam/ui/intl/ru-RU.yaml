    description: >-
      !js

      (name) => `${name ? name + ", по" : "По"} соображениям безопасности срок
      действия ваших учетных данных истёк. Пожалуйста, выполните повторный вход,
      чтобы продолжить.`
    title: С возвращением
  signout: Выйти
  login: Войти
  signin: Войти
  inApp:
    title: Небезопасный контекст
    description: Для вашей безопасности мы открыли приложение в вашем браузере.
    continue: Продолжить
