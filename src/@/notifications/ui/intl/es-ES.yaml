groups:
  joined:
    me: |-
      !js
      (groupName) => `Te has unido a ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("es", { style: "long", type:
      "conjunction" }).format(names)} se ha${names.length === 1 ? "" : "n"}
      unido a ${groupName}`
    other: >-
      !js

      (name, groupName, gender) => { if (gender === "he") return `${name} se
      unió a ${groupName}`; if (gender === "she") return `${name} se unió a
      ${groupName}`; return `${name} se unió a ${groupName}`; }
accounts:
  created:
    welcome: ¡Bienvenido a Evnly!
    hint: Desliza para eliminar
erase: Borrar todo
contacts:
  connected: |-
    !js
    (name) => `Ahora tú y ${name} sois amigos`
  unchained: >-
    !js

    (name, gender) => gender === "he" ? `${name} aceptó la cuenta` : gender ===
    "she" ? `${name} aceptó la cuenta` : `${name} aceptó la cuenta`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} recibió ${amount} de ti`;
        if (gender === "she") return `${name} recibió ${amount} de ti`;
        return `${name} recibió ${amount} de ti`;
      }
    received: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} te pagó ${amount}`;
        if (gender === "she") return `${name} te pagó ${amount}`;
        return `${name} te pagó ${amount}`;
      }
    balance:
      even: Ahora están a mano
      owed: |-
        !js
        (balance) => `Aún te deben ${balance}`
      owe: |-
        !js
        (balance) => `Ahora debes ${balance}`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("es", { style: "long", type:
    "conjunction" }).format(names); return `Pagado por ${list}`; }
adventures:
  joined:
    me: >-
      !js

      (title, gender) => gender === "he" ? `Has sido añadido a ${title}` :
      (gender === "she" ? `Has sido añadida a ${title}` : `Has sido añadido/a a
      ${title}`)
    other: |-
      !js
      (name, title, gender) => { return `${name} se unió a ${title}`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("es", { style: "long", type: "conjunction" }).format(names);
        if (names.length === 1) {
          if (grammar && grammar.gender === "he") return `${list} se unió a ${title}`;
          if (grammar && grammar.gender === "she") return `${list} se unió a ${title}`;
          return `${list} se unió a ${title}`;
        }
        return `${list} se unieron a ${title}`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `Gasto añadido a ${title}`
receipts:
  joined:
    hint: Revisa los artículos y reclama los tuyos.
    title: Acaba de llegar un nuevo recibo
