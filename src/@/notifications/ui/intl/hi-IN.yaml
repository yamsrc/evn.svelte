groups:
  joined:
    me: |-
      !js
      (groupName) => `${groupName} में आप शामिल हो गए हैं`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("hi", { style: "long", type:
      "conjunction" }).format(names)} ने ${groupName} में जॉइन किया`
    other: >-
      !js

      (name, groupName, gender) => { if (gender === "he") return `${name} ने
      ${groupName} जॉइन किया`; if (gender === "she") return `${name} ने
      ${groupName} जॉइन की`; return `${name} ने ${groupName} जॉइन किया/की`; }
accounts:
  created:
    welcome: Evnly में आपका स्वागत है!
    hint: हटाने के लिए स्लाइड करें
erase: सभी साफ़ करें
contacts:
  connected: |-
    !js
    (name) => `अब आप और ${name} दोस्त हैं`
  unchained: >-
    !js

    (name, gender) => gender === "he" ? `${name} ने खाता स्वीकार किया` : gender
    === "she" ? `${name} ने खाता स्वीकार किया` : `${name} ने खाता स्वीकार किया`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} ने आपसे ${amount} प्राप्त किया`;
        if (gender === "she") return `${name} ने आपसे ${amount} प्राप्त की`;
        return `${name} ने आपसे ${amount} प्राप्त किया/की`;
      }
    received: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} ने आपको ${amount} भुगतान किया`;
        if (gender === "she") return `${name} ने आपको ${amount} भुगतान किया`;
        return `${name} ने आपको ${amount} भुगतान किया`;
      }
    balance:
      even: अब आप बराबर हैं
      owed: |-
        !js
        (balance) => `आपको अभी भी ${balance} दिया जाना बाकी है`
      owe: |-
        !js
        (balance) => `आपको अभी ${balance} देना है`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("hi", { style: "long", type:
    "conjunction" }).format(names); return `${list} द्वारा भुगतान किया गया`; }
adventures:
  joined:
    me: >-
      !js

      (title, gender) => gender === "he" ? `${title} में आपको जोड़ा गया है` :
      (gender === "she" ? `${title} में आपको जोड़ी गई हैं` : `${title} में आपको
      जोड़ा/जोड़ी गया/गई है`)
    other: >-
      !js

      (name, title, gender) => { if (gender === "he") return `${name} ने
      ${title} में शामिल हो गया`; if (gender === "she") return `${name} ने
      ${title} में शामिल हो गई`; return `${name} ने ${title} में शामिल हो
      गया/गई`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("hi", { style: "long", type: "conjunction" }).format(names);
        if (names.length === 1) {
          if (grammar && grammar.gender === "he") return `${list} ने ${title} जॉइन किया`;
          if (grammar && grammar.gender === "she") return `${list} ने ${title} जॉइन की`;
          return `${list} ने ${title} जॉइन किया/की`;
        } else {
          return `${list} ने ${title} जॉइन किया`;
        }
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `${title} में खर्च जोड़ा गया`
receipts:
  joined:
    hint: सामानों को देखो और अपने हिस्से का चुनो।
    title: एक नई रसीद आई है
