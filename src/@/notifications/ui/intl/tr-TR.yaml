groups:
  joined:
    me: |-
      !js
      (groupName) => `${groupName} grubuna katıldınız`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("tr", { style: "long", type:
      "conjunction" }).format(names)} ${groupName} grubuna katıldı`
    other: |-
      !js
      (name, groupName, gender) => `${name}, ${groupName} grubuna katıldı`
accounts:
  created:
    welcome: Evnly'e hoş geldiniz!
    hint: Kaldırmak için kaydırın
erase: Tümünü temizle
contacts:
  connected: |-
    !js
    (name) => `Sen ve ${name} artık arkadaşsınız`
  unchained: |-
    !js
    (name, gender) => `${name} hesabı kabul etti`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name}, senden ${amount} aldı`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name} sana ${amount} ödedi`
    balance:
      even: Artık başa başsınız
      owed: |-
        !js
        (balance) => `Hâlâ ${balance} alacağınız var`
      owe: |-
        !js
        (balance) => `Şu anda ${balance} borcunuz var`
expenses:
  created: |-
    !js
    (amount, name, gender) => `${amount} ${name} tarafından ödendi`
