groups:
  joined:
    me: |-
      !js
      (groupName) => `Je bent lid geworden van ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("nl", { style: "long", type:
      "conjunction" }).format(names)} ${names.length === 1 ? "is" : "zijn"} lid
      geworden van ${groupName}`
    other: |-
      !js
      (name, groupName, gender) => `${name} is lid geworden van ${groupName}`
accounts:
  created:
    welcome: Welkom bij Evnly!
    hint: Veeg om te verwijderen
erase: Alles wissen
contacts:
  connected: |-
    !js
    (name) => `Je bent nu bevriend met ${name}`
  unchained: |-
    !js
    (name, gender) => `${name} heeft het account geaccepteerd`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name} heeft ${amount} van je ontvangen`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name} heeft je ${amount} betaald`
    balance:
      even: Jullie staan nu gelijk
      owed: |-
        !js
        (balance) => `Je hebt nog ${balance} tegoed.`
      owe: |-
        !js
        (name, balance) => `Je bent ${name} nu ${balance} verschuldigd.`
expenses:
  created: |-
    !js
    (name) => `Betaald door ${name}`
