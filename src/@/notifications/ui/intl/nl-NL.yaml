groups:
  joined:
    me: |-
      !js
      (groupName) => `Je bent lid geworden van ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("nl", { style: "long", type:
      "conjunction" }).format(names)} ${names.length === 1 ? "is" : "zijn"} lid
      geworden van ${groupName}`
    other: |-
      !js
      (name, groupName, gender) => `${name} is lid geworden van ${groupName}`
accounts:
  created:
    welcome: Welkom bij Evnly!
    hint: Veeg om te verwijderen
erase: Alles wissen
contacts:
  connected: |-
    !js
    (name) => `Jij en ${name} zijn nu vrienden`
  unchained: |-
    !js
    (name, gender) => `${name} heeft het account geaccepteerd`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name} heeft ${amount} van je ontvangen`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name} heeft je ${amount} betaald`
    balance:
      even: Jullie staan nu gelijk
      owed: |-
        !js
        (balance) => `Je krijgt nog ${balance}`
      owe: |-
        !js
        (balance) => `Je moet nu ${balance} betalen`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("nl", { style: "long", type:
    "conjunction" }).format(names); return `Betaald door ${list}`; }
adventures:
  joined:
    me: |-
      !js
      (title, gender) => `Je bent toegevoegd aan ${title}`
    other: >-
      !js

      (name, title, gender) => { return `${name} is lid geworden van ${title}`;
      }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("nl", { style: "long", type: "conjunction" }).format(names);
        return names.length === 1 ? `${list} is lid geworden van ${title}` : `${list} zijn lid geworden van ${title}`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `Uitgave toegevoegd aan ${title}`
receipts:
  joined:
    hint: Check de items en claim die van jou.
    title: Er is zojuist een nieuw bonnetje binnengekomen
