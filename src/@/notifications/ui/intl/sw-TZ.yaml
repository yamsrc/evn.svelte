groups:
  joined:
    me: |-
      !js
      (groupName) => `Umejiunga na ${groupName}`
    others: |-
      !js
      (names, groupName) => `${new Intl.ListFormat("sw", { style: "long", type: "conjunction" }).format(names)} amejiunga na ${groupName}`
    other: |-
      !js
      (name, groupName, gender) => `${name} amejiunga na ${groupName}`
accounts:
  created:
    welcome: Karibu kwenye Evnly!
    hint: Telezesha kuondoa
erase: Futa zote
contacts:
  connected: |-
    !js
    (name) => `Wewe na ${name} sasa ni marafiki`
  unchained: |-
    !js
    (name, gender) => `${name} amekubali akaunti`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name} amepokea ${amount} kutoka kwako`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name} amekulipa ${amount}`
    balance:
      even: Sasa ninyi mko sawa
      owed: |-
        !js
        (balance) => `Bado unaidai ${balance}`
      owe: |-
        !js
        (balance) => `Unadaiwa ${balance} sasa`
expenses:
  created: |-
    !js
    (amount, name, gender) => `${amount} imelipwa na ${name}`
nudge:
  prompt: Unataka kuona matukio kama haya mara tu yanapotokea? Washa arifa upate taarifa hizo kwa wakati kwenye kifaa chako.
  button: Washa arifa
