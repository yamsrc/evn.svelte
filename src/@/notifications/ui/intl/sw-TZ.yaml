groups:
  joined:
    me: |-
      !js
      (groupName) => `Umejiunga na ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("sw", { style: "long", type:
      "conjunction" }).format(names)} amejiunga na ${groupName}`
    other: |-
      !js
      (name, groupName, gender) => `${name} amejiunga na ${groupName}`
accounts:
  created:
    welcome: Karibu kwenye Evnly!
    hint: Telezesha kuondoa
erase: Futa zote
contacts:
  connected: |-
    !js
    (name) => `Wewe na ${name} sasa ni marafiki`
  unchained: |-
    !js
    (name, gender) => `${name} amekubali akaunti`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name} amepokea ${amount} kutoka kwako`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name} amekulipa ${amount}`
    balance:
      even: Sasa ninyi mko sawa
      owed: |-
        !js
        (balance) => `Bado unaidai ${balance}`
      owe: |-
        !js
        (balance) => `Unadaiwa ${balance} sasa`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("sw", { style: "long", type:
    "conjunction" }).format(names); return `Imelipwa na ${list}`; }
adventures:
  joined:
    me: |-
      !js
      (title, gender) => `Umeongezwa kwenye ${title}`
    other: |-
      !js
      (name, title, gender) => { return `${name} amejiunga na ${title}`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("sw", { style: "long", type: "conjunction" }).format(names);
        return names.length === 1 ? `${list} amejiunga na ${title}` : `${list} wamejiunga na ${title}`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `Gharama imeongezwa kwa ${title}`
receipts:
  joined:
    hint: Angalia vitu na chukua ulivyolipa.
    title: Risiti mpya imewasili
