groups:
  joined:
    me: |-
      !js
      (groupName) => `Umejiunga na ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("sw", { style: "long", type:
      "conjunction" }).format(names)} amejiunga na ${groupName}`
accounts:
  created:
    welcome: Karibu kwenye Evnly!
    hint: Telezesha kuondoa
erase: Futa zote
contacts:
  connected: |-
    !js
    (name) => `Sasa umefanya urafiki na ${name}`
  unchained: |-
    !js
    (name, gender) => `${name} amekubali akaunti`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name} amepokea ${amount} kutoka kwako`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name} amekulipa ${amount}`
    balance:
      even: Sasa ninyi mko sawa
      owed: |-
        !js
        (balance) => `Bado unadai ${balance}.`
      owe: |-
        !js
        (name, balance) => `Unamdai ${name} ${balance} sasa.`
expenses:
  created: |-
    !js
    (name) => `Imelipwa na ${name}`
