groups:
  joined:
    me: |-
      !js
      (groupName) => `Вы присоединились к группе ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("ru", { style: "long", type:
      "conjunction" }).format(names)} присоединил${names.length === 1 ? "ся" :
      "ись"} к группе ${groupName}`
accounts:
  created:
    welcome: Добро пожаловать в Evnly!
    hint: Свайпните, чтобы удалить
erase: |-
  !js
  (n) => `Удалить всё (${n})`
