groups:
  joined:
    me: |-
      !js
      (groupName) => `لقد انضممت إلى ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("ar", { style: "long", type:
      "conjunction" }).format(names)} انضم${names.length === 1 ? "ت" : "وا"} إلى
      ${groupName}`
    other: >-
      !js

      (name, groupName, gender) => { if (gender === "he") return `${name} انضم
      إلى ${groupName}`; if (gender === "she") return `${name} انضمت إلى
      ${groupName}`; return `${name} انضم(ت) إلى ${groupName}`; }
accounts:
  created:
    welcome: مرحبًا بك في Evnly!
    hint: اسحب للإزالة
erase: مسح الكل
contacts:
  connected: |-
    !js
    (name) => `أنت و${name} الآن أصدقاء`
  unchained: >-
    !js

    (name, gender) => gender === "he" ? `${name} قَبِل الحساب` : gender ===
    "she" ? `${name} قَبِلَت الحساب` : `${name} قَبِل(ت) الحساب`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} استلم ${amount} منك`;
        if (gender === "she") return `${name} استلمت ${amount} منك`;
        return `${name} استلم/استلمت ${amount} منك`;
      }
    received: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} دفع لك ${amount}`;
        if (gender === "she") return `${name} دفعت لك ${amount}`;
        return `${name} دفع(ت) لك ${amount}`;
      }
    balance:
      even: أنتما متعادلان الآن
      owed: |-
        !js
        (balance) => `لا يزال مستحقًا لك ${balance}`
      owe: |-
        !js
        (balance) => `أنت مدين الآن بمبلغ ${balance}`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("ar", { style: "long", type:
    "conjunction" }).format(names); return `تم الدفع بواسطة ${list}`; }
adventures:
  joined:
    me: >-
      !js

      (title, gender) => gender === "he" ? `تمت إضافتك إلى ${title}` : (gender
      === "she" ? `تمت إضافتكِ إلى ${title}` : `تمت إضافتك/إضافتكِ إلى
      ${title}`)
    other: >-
      !js

      (name, title, gender) => { if (gender === "he") return `${name} انضم إلى
      ${title}`; if (gender === "she") return `${name} انضمت إلى ${title}`;
      return `${name} انضم(ت) إلى ${title}`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("ar", { style: "long", type: "conjunction" }).format(names);
        if (names.length === 1) {
          if (grammar && grammar.gender === "he") return `${list} انضم إلى ${title}`;
          if (grammar && grammar.gender === "she") return `${list} انضمت إلى ${title}`;
          return `${list} انضم(ت) إلى ${title}`;
        }
        return `${list} انضموا إلى ${title}`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `تمت إضافة مصروف إلى ${title}`
