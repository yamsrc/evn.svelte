groups:
  joined:
    me: |-
      !js
      (groupName) => `Du bist ${groupName} beigetreten`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("de", { style: "long", type:
      "conjunction" }).format(names)} ${names.length === 1 ? "ist" : "sind"}
      ${groupName} beigetreten`
    other: >-
      !js

      (name, groupName, gender) => { if (gender === "he") return `${name} ist
      ${groupName} beigetreten`; if (gender === "she") return `${name} ist
      ${groupName} beigetreten`; return `${name} ist ${groupName} beigetreten`;
      }
accounts:
  created:
    welcome: Willkommen bei Evnly!
    hint: Zum Entfernen wischen
erase: Alle löschen
contacts:
  connected: |-
    !js
    (name) => `Du und ${name} seid jetzt befreundet`
  unchained: >-
    !js

    (name, gender) => gender === "he" ? `${name} hat das Konto akzeptiert` :
    gender === "she" ? `${name} hat das Konto akzeptiert` : `${name} hat das
    Konto akzeptiert`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name} hat ${amount} von dir erhalten`;
      }
    received: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} hat dir ${amount} bezahlt`;
        if (gender === "she") return `${name} hat dir ${amount} bezahlt`;
        return `${name} hat dir ${amount} bezahlt`;
      }
    balance:
      even: Ihr seid jetzt quitt
      owed: |-
        !js
        (balance) => `Dir stehen noch ${balance} zu`
      owe: |-
        !js
        (balance) => `Ihr aktueller Kontostand beträgt ${balance}`
expenses:
  created: |-
    !js
    (amount, name, gender) => `${amount} von ${name} bezahlt`
adventures:
  joined:
    me: |-
      !js
      (title, gender) => `Du wurdest zu ${title} hinzugefügt`
    other: |-
      !js
      (name, title, gender) => { return `${name} ist ${title} beigetreten`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("de", { style: "long", type: "conjunction" }).format(names);
        return names.length === 1 ? `${list} ist ${title} beigetreten` : `${list} sind ${title} beigetreten`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `Ausgabe zu ${title} hinzugefügt`
