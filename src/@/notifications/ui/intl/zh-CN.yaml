groups:
  joined:
    me: |-
      !js
      (groupName) => `您已加入${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("zh", { style: "long", type:
      "conjunction" }).format(names)}已加入${groupName}`
    other: |-
      !js
      (name, groupName, gender) => `${name}加入了${groupName}`
accounts:
  created:
    welcome: 欢迎来到 Evnly！
    hint: 滑动移除
erase: 全部清除
contacts:
  connected: |-
    !js
    (name) => `你和${name}现在是朋友了`
  unchained: |-
    !js
    (name, gender) => `${name}已接受该账户`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name}已收到你转来的${amount}`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name}已向你支付了${amount}`
    balance:
      even: 你们现在扯平了
      owed: |-
        !js
        (balance) => `你仍然有${balance}未收到`
      owe: |-
        !js
        (balance) => `您现在需支付${balance}`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("zh-CN", { style: "long",
    type: "conjunction" }).format(names); return `由${list}付款`; }
adventures:
  joined:
    me: |-
      !js
      (title, gender) => `你已被添加到${title}`
    other: |-
      !js
      (name, title, gender) => { return `${name}已加入${title}`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("zh-CN", { style: "long", type: "conjunction" }).format(names);
        return `${list}已加入${title}`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `已将支出添加到${title}`
