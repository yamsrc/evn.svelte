groups:
  joined:
    me: |-
      !js
      (groupName) => `您已加入${groupName}`
    others: |-
      !js
      (names, groupName) => `${new Intl.ListFormat("zh", { style: "long", type: "conjunction" }).format(names)}已加入${groupName}`
    other: |-
      !js
      (name, groupName, gender) => `${name}加入了${groupName}`
accounts:
  created:
    welcome: 欢迎来到 Evnly！
    hint: 滑动移除
erase: 全部清除
contacts:
  connected: |-
    !js
    (name) => `你和${name}现在是朋友了`
  unchained: |-
    !js
    (name, gender) => `${name}已接受该账户`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name}已收到你转来的${amount}`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name}已向你支付了${amount}`
    balance:
      even: 你们现在扯平了
      owed: |-
        !js
        (balance) => `你仍然有${balance}未收到`
      owe: |-
        !js
        (balance) => `您现在需支付${balance}`
expenses:
  created: |-
    !js
    (amount, name, gender) => `${name}已支付${amount}`
nudge:
  prompt: 想第一时间看到这样的活动吗？开启通知，及时在你的设备上收到最新消息。
  button: 启用通知
