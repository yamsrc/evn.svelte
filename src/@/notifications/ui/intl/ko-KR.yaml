groups:
  joined:
    me: |-
      !js
      (groupName) => `${groupName}에 참가하셨습니다`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("ko", { style: "long", type:
      "conjunction" }).format(names)}님이(가) ${groupName}에 가입했어요`
    other: |-
      !js
      (name, groupName, gender) => `${name}님이 ${groupName}에 참여했습니다`
accounts:
  created:
    welcome: Evnly에 오신 것을 환영합니다!
    hint: 밀어서 제거
erase: 모두 지우기
contacts:
  connected: |-
    !js
    (name) => `당신과 ${name}님이 이제 친구가 되었습니다`
  unchained: |-
    !js
    (name, gender) => `${name}님이 계정을 승인했습니다`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name}님이 당신에게서 ${amount}을(를) 받았습니다`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name}님이 당신에게 ${amount}을(를) 보냈습니다`
    balance:
      even: 이제 당신들은 서로 비겼습니다
      owed: |-
        !js
        (balance) => `아직 받을 금액이 ${balance}입니다`
      owe: |-
        !js
        (balance) => `현재 ${balance}을(를) 지불해야 합니다`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("ko", { style: "long", type:
    "conjunction" }).format(names); return `${list}님이 결제함`; }
adventures:
  joined:
    me: |-
      !js
      (title, gender) => `${title}에 추가되었습니다`
    other: |-
      !js
      (name, title, gender) => { return `${name}님이 ${title}에 참가했습니다`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("ko", { style: "long", type: "conjunction" }).format(names);
        return `${list}님이 ${title}에 참가했습니다`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `${title}에 지출이 추가되었습니다`
