groups:
  joined:
    me: |-
      !js
      (groupName) => `You have joined ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("en", { style: "long", type:
      "conjunction" }).format(names)} joined ${groupName}`
    other: |-
      !js
      (name, groupName, gender) => `${name} joined ${groupName}`
accounts:
  created:
    welcome: Welcome to Evnly!
    hint: Slide to remove
erase: Clear all
contacts:
  connected: |-
    !js
    (name) => `You and ${name} are now friends`
  unchained: |-
    !js
    (name, gender) => `${name} accepted the account`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        return `${name} received ${amount} from you`;
      }
    received: |-
      !js
      (name, amount, gender) => `${name} paid you ${amount}`
    balance:
      even: You are even now
      owed: |-
        !js
        (balance) => `You're still owed ${balance}`
      owe: |-
        !js
        (balance) => `You owe ${balance} now`
expenses:
  expense: >-
    !js

    (names) => { const list = new Intl.ListFormat("en", { style: "long", type:
    "conjunction" }).format(names); return `Paid by ${list}`; }
adventures:
  joined:
    me: |-
      !js
      (title, gender) => `You've been added to ${title}`
    other: |-
      !js
      (name, title, gender) => { return `${name} joined ${title}`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("en", { style: "long", type: "conjunction" }).format(names);
        return names.length === 1 ? `${list} joined ${title}` : `${list} joined ${title}`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `Expense added to ${title}`
receipts:
  joined:
    hint: Check the items and claim yours.
    title: A new receipt just landed
