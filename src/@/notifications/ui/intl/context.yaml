context: Mount 'notifications' context
inputs:
  groups:
    joined:
      me:
        input: You have joined {groupName}
        context: make it a function
      others:
        input: "{...names} joined {groupName}"
        context: make a function, that accepts array of names (one or more) and a group name. list is formatted using Intl.ListFormat
  accounts:
    created:
      hint:
        input: Slide to remove
  erase:
    input: Clear all
    context: button label (clears all notifications)
  contacts:
    connected:
      input: You are now friends with {name}
    unchained:
      input: "{name} accepted the account"
      context: Use gender
    transferred:
      paid:
        input: "{name} received {amount} from you"
        context: use gender
      received:
        input: "{name} paid you {amount}"
        context: use gender
      balance:
        even:
          input: You are even now
        owed:
          input: You're still owed {balance}.
        owe:
          input: You owe {name} {balance} now.
  expenses:
    created:
      input: Paid by {name}.
