groups:
  joined:
    me: |-
      !js
      (groupName) => `Ви приєдналися до ${groupName}`
    others: >-
      !js

      (names, groupName) => `${new Intl.ListFormat("uk", { style: "long", type:
      "conjunction" }).format(names)} ${names.length === 1 ? "приєднався" :
      "приєдналися"} до ${groupName}`
    other: >-
      !js

      (name, groupName, gender) => { if (gender === "he") return `${name}
      приєднався до ${groupName}`; if (gender === "she") return `${name}
      приєдналася до ${groupName}`; return `${name} приєднався(лася) до
      ${groupName}`; }
accounts:
  created:
    welcome: Ласкаво просимо до Evnly!
    hint: Проведіть, щоб видалити
erase: Очистити все
contacts:
  connected: |-
    !js
    (name) => `Ви та ${name} тепер друзі`
  unchained: >-
    !js

    (name, gender) => gender === "he" ? `${name} прийняв обліковий запис` :
    gender === "she" ? `${name} прийняла обліковий запис` : `${name} прийняв(ла)
    обліковий запис`
  transferred:
    paid: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} отримав ${amount} від вас`;
        if (gender === "she") return `${name} отримала ${amount} від вас`;
        return `${name} отримав(ла) ${amount} від вас`;
      }
    received: |-
      !js
      (name, amount, gender) => {
        if (gender === "he") return `${name} заплатив вам ${amount}`;
        if (gender === "she") return `${name} заплатила вам ${amount}`;
        return `${name} заплатив(ла) вам ${amount}`;
      }
    balance:
      even: Тепер ви квити
      owed: |-
        !js
        (balance) => `Вам ще винні ${balance}`
      owe: |-
        !js
        (balance) => `Зараз ви винні ${balance}`
expenses:
  created: >-
    !js

    (amount, name, gender) => gender === "he" ? `${amount} сплачено ${name}` :
    gender === "she" ? `${amount} сплачено ${name}ою` : `${amount} сплачено
    ${name}`
adventures:
  joined:
    me: >-
      !js

      (title, gender) => gender === "he" ? `Вас додано до ${title}` : (gender
      === "she" ? `Вас додано до ${title}`.replace("о", "а") : `Вас додано(а) до
      ${title}`)
    other: >-
      !js

      (name, title, gender) => { if (gender === "he") return `${name} приєднався
      до ${title}`; if (gender === "she") return `${name} приєдналася до
      ${title}`; return `${name} приєднався/приєдналася до ${title}`; }
    others: |-
      !js
      (names, title, grammar) => {
        const list = new Intl.ListFormat("uk", { style: "long", type: "conjunction" }).format(names);
        if (names.length === 1) {
          if (grammar && grammar.gender === "he") return `${list} приєднався до ${title}`;
          if (grammar && grammar.gender === "she") return `${list} приєдналася до ${title}`;
          return `${list} приєднався(лася) до ${title}`;
        }
        return `${list} приєдналися до ${title}`;
      }
  expense:
    title: |-
      !js
      (title, amount) => `${title} · ${amount}`
    body: |-
      !js
      (title) => `Витрату додано до ${title}`
