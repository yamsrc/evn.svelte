context: Mount 'groups' context
inputs:
  reduction:
    switch:
      label:
        input: Smart Debts
        context: checkbox label (feature name)
      description:
        input: Merges debts between members so fewer payments are needed to settle everything. No one pays more or less — it just reduces the number of transactions.
  expenses:
    title:
      input: Events
      context: Section header for group expenses list
    empty:
      input: No shared expenses so far.
      context: Empty state for group expenses list
  balance:
    input: Your balance
    context: Label of group expenses balance
  cover:
    input: Cover
    context: Section heading for optional group cover image picker
  details:
    total:
      input: Total spent
      context: Label for total amount spent by all group members
    paid:
      input: You’ve paid
      context: Label for amount paid by the current user in a group; wording depends on user grammar
  editor:
    settings:
      input: Settings
      context: Header title for editing group settings
  selector:
    none:
      input: Split
  card:
    balance:
      input: Balance
    total:
      input: Всего
