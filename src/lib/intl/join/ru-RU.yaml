account:
  title: Перевод аккаунта
  description: Кто-то создал этот аккаунт и передаёт его вам.
  accept: Принять аккаунт
  content0: >-
    Чтобы получить право владения, настройте свои данные для входа. Это не
    создаст новую учетную запись — вы просто получите доступ к этой.
  content1: >-
    Это не создаст новую учетную запись — просто даст вам доступ к этой и
    позволит управлять ею.
  conflict:
    content0: >-
      !js

      (name) => `${name}, чтобы принять этот аккаунт, вам потребуется выйти из
      текущего и настроить новые данные для входа.`
    content1: Это не объединит аккаунты — вы просто перейдёте на новый.
  switch: Сменить аккаунт
  expired:
    content: Попросите отправителя сгенерировать новую ссылку.
    description: Срок действия этого запроса на перевод истёк.
    title: Время передачи истекло
  og:
    tile: Перехватите управление своим аккаунтом на Evnly.
    description: >-
      !js

      (name) => `${name}, для вас создана эта учетная запись. Примите владение,
      настроив данные для входа.`
actions:
  discard: Отклонить
  close: Закрыть
friends:
  app:
    description: Умный способ вместе с друзьями отслеживать, кто кому сколько должен.
  inviter:
    description: >-
      !js

      (name) => `Вас пригласил(а) ${name}. Просто зарегистрируйтесь или войдите
      — и всё готово!`
  accept: Начать пользоваться Evn
  og:
    description: >-
      Отслеживайте общие расходы, делите затраты и оставайтесь на одной волне —
      вместе на Evnly.
    title: |-
      !js
      (name) => `Присоединяйся к ${name} на Evnly`
  dialog:
    title: Подключиться на Evnly
    description: Войдите или создайте аккаунт, чтобы продолжить.
    accept: Подключиться
    decline: Не сейчас
    content: >-
      !js

      (name) => `${name} хочет добавить вас в друзья на Evnly, чтобы отслеживать
      общие расходы.`
group:
  og:
    title: |-
      !js
      (groupName) => `Присоединиться к «${groupName}» на Evnly`
    description: >-
      !js

      (names) => `Разделяй расходы с ${new Intl.ListFormat("ru", { style:
      "long", type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `Присоединиться к ${groupname}`
    join: Присоединиться
    decline: Отклонить
