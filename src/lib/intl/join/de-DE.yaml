account:
  title: Kontenübertrag
  description: Jemand hat dieses Konto erstellt und überträgt es nun an dich.
  accept: Konto akzeptieren
  content0: >-
    Um die Inhaberschaft zu übernehmen, richte bitte deine Anmeldedaten ein.
    Dadurch wird kein neues Konto erstellt – du erhältst nur Zugriff auf dieses
    Konto.
  content1: >-
    Dadurch wird kein neues Konto erstellt – du bekommst lediglich Zugriff auf
    dieses und kannst es verwalten.
  conflict:
    content0: >-
      !js

      (name) => `${name}, um dieses Konto zu akzeptieren, wirst du von deinem
      aktuellen Konto abgemeldet und musst neue Anmeldedaten festlegen.`
    content1: >-
      Dadurch werden die Konten nicht zusammengeführt – du wechselst einfach zum
      neuen Konto.
  switch: Konto wechseln
  expired:
    content: Bitte den Absender, einen neuen Link zu erstellen.
    description: Diese Überweisungsanfrage ist abgelaufen.
    title: Übertragung abgelaufen
  og:
    tile: Übernimm dein Evnly.
    description: >-
      !js

      (name) => `${name}, dieses Konto wurde für dich erstellt. Übernimm es,
      indem du deine Anmeldedaten festlegst.`
actions:
  discard: Ablehnen
  close: Schließen
friends:
  app:
    description: >-
      Die clevere Art, gemeinsam mit Freunden zu verfolgen, wer wem etwas
      schuldet.
  inviter:
    description: >-
      !js

      (name) => `${name} hat dich eingeladen. Registriere dich einfach oder
      melde dich an und schon kann es losgehen!`
  accept: Evnly jetzt nutzen
  og:
    description: >-
      Geteilte Ausgaben verfolgen, Kosten aufteilen und immer abgestimmt bleiben
      – gemeinsam auf Evnly.
    title: |-
      !js
      (name) => `Tritt ${name} auf Evnly bei`
  dialog:
    title: Auf Evnly verbinden
    description: Melden Sie sich an oder erstellen Sie ein Konto, um fortzufahren.
    accept: Verbinden
    decline: Nicht jetzt
    content: >-
      !js

      (name) => `${name} möchte sich auf Evnly mit dir verbinden, um gemeinsame
      Ausgaben zu verfolgen.`
group:
  og:
    title: |-
      !js
      (groupName) => `Tritt ${groupName} auf Evnly bei`
    description: >-
      !js

      (names) => `Teile die Ausgaben mit ${new Intl.ListFormat("de", { style:
      "long", type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `Tritt ${groupname} bei`
    join: Beitreten
    decline: Ablehnen
adventures:
  og:
    title: |-
      !js
      (title) => `Tritt ${title} auf Evnly bei`
    description: >-
      Teilt eure Abenteuerkosten und behaltet den Überblick – gemeinsam auf
      Evnly.
  dialog:
    title: |-
      !js
      (title) => `Tritt ${title} bei`
    join: Beitreten
    decline: Ignorieren
    description: |-
      !js
      (name, gender) => `${name} lädt dich zum Abenteuer ein`
    heading: Einladung zum Abenteuer
