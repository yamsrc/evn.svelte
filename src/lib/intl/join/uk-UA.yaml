account:
  title: Передача облікового запису
  description: Хтось створив цей обліковий запис і передає його вам.
  accept: Прийняти обліковий запис
  content0: >-
    Щоб отримати право володіння, налаштуйте свої дані для входу. Це не створить
    новий обліковий запис — ви просто отримаєте доступ до цього.
  content1: >-
    Це не створить новий обліковий запис — просто дозволить вам отримати доступ
    до цього та керувати ним.
  conflict:
    content0: >-
      !js

      (name) => `${name}, щоб прийняти цей обліковий запис, вам потрібно вийти з
      поточного та налаштувати нові дані для входу.`
    content1: Це не об'єднає облікові записи — ви просто перейдете до нового.
  switch: Змінити обліковий запис
  expired:
    content: Попросіть відправника створити нове посилання.
    description: Термін дії цього запиту на переказ минув.
    title: Термін передачі минув
  og:
    tile: Переберіть контроль над своїм обліковим записом на Evnly.
    description: >-
      !js

      (name) => `${name}, цей обліковий запис створено для вас. Станьте
      власником, налаштувавши дані для входу.`
actions:
  discard: Відхилити
  close: Закрити
friends:
  app:
    description: Розумний спосіб разом із друзями відстежувати, хто кому винен.
  inviter:
    description: >-
      !js

      (name) => `Вас запросив(ла) ${name}. Просто зареєструйтеся або увійдіть —
      і все готово!`
  accept: Почати користуватися Evnly
  og:
    description: >-
      Відстежуйте спільні витрати, діліть рахунки та залишайтеся на зв’язку —
      разом на Evnly.
    title: |-
      !js
      (name) => `Приєднуйся до ${name} на Evnly`
  dialog:
    title: Підключайтеся на Evnly
    description: Увійдіть або створіть обліковий запис, щоб продовжити.
    accept: Підключитися
    decline: Не зараз
    content: >-
      !js

      (name) => `${name} хоче підключитися до вас у Evnly, щоб відстежувати
      спільні витрати.`
group:
  og:
    title: |-
      !js
      (groupName) => `Приєднатися до «${groupName}» на Evnly`
    description: >-
      !js

      (names) => `Розділіть витрати з ${new Intl.ListFormat("uk", { style:
      "long", type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `Приєднатися до ${groupname}`
    join: Приєднатися
    decline: Відхилити
