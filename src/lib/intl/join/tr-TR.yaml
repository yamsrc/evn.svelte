account:
  title: Hesap transferi
  description: Birisi bu hesabı oluşturdu ve şimdi onu sana devrediyor.
  accept: Hesabı kabul et
  content0: >-
    Sahipliği almak için oturum açma bilgilerini ayarla. Bu, yeni bir hesap
    oluşturmaz — sadece bu hesaba erişmeni sağlar.
  content1: Bu yeni bir hesap oluşturmaz — sadece bu hesaba erişip yönetmeni sağlar.
  conflict:
    content0: >-
      !js

      (name) => `${name}, bu hesabı kabul etmek için mevcut hesabınızdan çıkış
      yapacak ve yeni oturum açma bilgileri ayarlayacaksınız.`
    content1: Bu hesapları birleştirmez — yeni hesabına geçiş yapacaksın.
  switch: Hesabı değiştir
  expired:
    content: Gönderen kişiden yeni bir bağlantı oluşturmasını isteyin.
    description: Bu transfer isteğinin süresi doldu.
    title: Aktarım süresi doldu
  og:
    tile: Evnly hesabınızı devralın.
    description: >-
      !js

      (name) => `${name}, bu hesap sizin için oluşturuldu. Giriş bilgilerinizi
      ayarlayarak sahiplenin.`
actions:
  discard: Reddet
  close: Kapat
friends:
  app:
    description: Kim kime ne borçlu, arkadaşlarınla birlikte takip etmenin akıllı yolu.
  inviter:
    description: >-
      !js

      (name) => `${name} tarafından davet edildiniz. Sadece kaydolun veya giriş
      yapın, hazırsınız!`
  accept: Evnly’i kullanmaya başla
  og:
    description: >-
      Paylaşılan harcamaları takip edin, masrafları bölüştürün ve uyumlu kalın —
      Evnly'de birlikte.
    title: |-
      !js
      (name) => `Evnly'de ${name}'e katıl`
  dialog:
    title: Evnly'de bağlan
    description: Devam etmek için giriş yapın veya bir hesap oluşturun.
    accept: Bağlan
    decline: Şimdi değil
    content: >-
      !js

      (name) => `${name}, Evnly'de seninle bağlantı kurup ortak giderlerinizi
      takip etmek istiyor.`
group:
  og:
    title: |-
      !js
      (groupName) => `Evnly'de ${groupName} grubuna katıl`
    description: >-
      !js

      (names) => `${new Intl.ListFormat("tr", { style: "long", type:
      "conjunction" }).format(names)} ile masrafları paylaş`
  dialog:
    title: |-
      !js
      (groupname) => `${groupname}’e Katıl`
    join: Katıl
    decline: Reddet
adventures:
  og:
    title: |-
      !js
      (title) => `Evnly'de ${title}’a katıl`
    description: >-
      Macera masraflarını paylaşın ve eşit olarak takip edin — Evnly'de
      birlikte.
  dialog:
    title: |-
      !js
      (title) => `${title}'a katıl`
    join: Katıl
    decline: Yoksay
    description: |-
      !js
      (name, gender) => `${name} seni maceraya davet ediyor`
    heading: Macera davetiyesi
receipts:
  og:
    title: |-
      !js
      (title) => `Evnly'de ${title}'a katıl`
    description: >-
      Bir fişi bölüştürün ve kimin kime borcu olduğunu Evnly ile birlikte takip
      edin.
  dialog:
    join: Katıl
    decline: Reddet
    title: Hesaba davet
    description: |-
      !js
      (name, gender) => {
        return `${name} sizi hesaba eklemek istiyor.`;
      }
