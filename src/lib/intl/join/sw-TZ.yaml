account:
  title: Uhamisho wa akaunti
  description: Mtu fulani ameunda akaunti hii na anaikukabidhi kwako.
  accept: Kubali akaunti
  content0: >-
    Ili kuwa mmiliki, weka taarifa zako za kuingia. Hii haitaunda akaunti mpya —
    itakupa tu ufikiaji wa hii.
  content1: Hii haitaunda akaunti mpya — itakuwezesha tu kupata na kudhibiti hii.
  conflict:
    content0: >-
      !js

      (name) => `${name}, ili kukubali akaunti hii, utatolewa kwenye akaunti
      yako ya sasa na kuweka maelezo mapya ya kuingia.`
    content1: Hili haitaunganisha akaunti — utahama kwenda mpya.
  switch: Badilisha akaunti
  expired:
    content: Muombe mtoa taarifa atengeneze kiungo kipya.
    description: Ombi hili la uhamisho limekwisha muda wake.
    title: Uhamisho umeisha muda wake
  og:
    tile: Chukua udhibiti wa akaunti yako kwenye Evnly.
    description: >-
      !js

      (name) => `${name}, akaunti hii iliundwa kwa ajili yako. Miliki kwa kuweka
      maelezo ya kuingia.`
actions:
  discard: Tupa mbali
  close: Funga
friends:
  app:
    description: Njia bora ya kufuatilia nani anamdai nani, ukiwa pamoja na marafiki.
  inviter:
    description: >-
      !js

      (name) => `Umealikwa na ${name}. Jisajili au ingia tu, na uko tayari
      kuanza!`
  accept: Anza kutumia Evnly
  og:
    description: >-
      Fatilia matumizi ya pamoja, gawanya gharama, na dumuni mmelingano — pamoja
      kwenye Evnly.
    title: |-
      !js
      (name) => `Jiunge na ${name} kwenye Evnly`
  dialog:
    title: Unganisha kwenye Evnly
    description: Ingia au tengeneza akaunti ili kuendelea.
    accept: Unganisha
    decline: Siyo sasa
    content: >-
      !js

      (name) => `${name} anataka kuungana nawe kwenye Evnly ili kufuatilia
      matumizi yenu ya pamoja.`
group:
  og:
    title: |-
      !js
      (groupName) => `Jiunge na ${groupName} kwenye Evnly`
    description: >-
      !js

      (names) => `Gawa gharama na ${new Intl.ListFormat("sw", { style: "long",
      type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `Jiunge na ${groupname}`
    join: Jiunge
    decline: Kataa
