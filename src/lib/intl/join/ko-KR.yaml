account:
  title: 계정 이전
  description: 누군가 이 계정을 만들었으며 지금 당신에게 이전하고 있습니다.
  accept: 계정 승인
  content0: 소유권을 가져오려면 로그인 정보를 설정하세요. 이것은 새 계정을 만드는 것이 아니라, 이 계정에 대한 접근 권한만 부여합니다.
  content1: 새 계정을 만들지는 않습니다. 이 계정에 접근하고 관리할 수 있게 해줍니다.
  conflict:
    content0: |-
      !js
      (name) => `${name}님, 이 계정을 승인하려면 현재 계정에서 로그아웃하고 새로운 로그인 정보를 설정해야 합니다.`
    content1: 계정이 병합되지 않습니다 — 새 계정으로 전환됩니다.
  switch: 계정 전환
  expired:
    content: 보내는 사람에게 새 링크를 생성해 달라고 요청하세요.
    description: 이체 요청이 만료되었습니다.
    title: 전송 만료됨
  og:
    tile: Evnly에서 계정을 인수하세요.
    description: |-
      !js
      (name) => `${name}님, 이 계정은 회원님을 위해 생성되었습니다. 로그인 정보를 설정하여 소유권을 가져가세요.`
actions:
  discard: 버리기
  close: 닫기
friends:
  app:
    description: 친구들과 함께 누가 누구에게 얼마를 빚졌는지 스마트하게 관리하는 방법.
  inviter:
    description: |-
      !js
      (name) => `${name}님이 초대하셨습니다. 가입하거나 로그인하면 바로 시작할 수 있어요!`
  accept: Evnly 시작하기
  og:
    description: 공동 지출을 기록하고, 비용을 나누며, 항상 함께 맞춰보세요 — Evnly에서 같이.
    title: |-
      !js
      (name) => `Evnly에서 ${name}와 함께해요`
  dialog:
    title: Evnly에서 연결하기
    description: 계속하려면 로그인하거나 계정을 생성하세요.
    accept: 연결
    decline: 지금은 아니에요
    content: |-
      !js
      (name) => `${name}님이 Evnly에서 함께 연결해 공동 지출을 관리하고 싶어합니다.`
group:
  og:
    title: |-
      !js
      (groupName) => `Evnly에서 ${groupName}에 참여하세요`
    description: >-
      !js

      (names) => `${new Intl.ListFormat("ko", { style: "long", type:
      "conjunction" }).format(names)}와(과) 비용을 나누세요`
  dialog:
    title: |-
      !js
      (groupname) => `${groupname}에 가입하기`
    join: 참여하기
    decline: 거절
adventures:
  og:
    title: |-
      !js
      (title) => `Evnly에서 ${title}에 참여하세요`
    description: 모험 경비를 함께 나누고 공평하게 정산하세요 — Evnly에서 함께해요.
  dialog:
    title: |-
      !js
      (title) => `${title} 참가하기`
    join: 참여하기
    decline: 무시
    description: |-
      !js
      (name, gender) => `${name}님이 모험에 초대합니다`
    heading: 모험으로의 초대
receipts:
  og:
    title: |-
      !js
      (title) => `Evnly에서 ${title}에 참여하세요`
    description: 영수증을 나누고 누가 누구에게 얼마를 빚졌는지 함께 Evnly에서 확인하세요.
  dialog:
    join: 참여하기
    decline: 거절
    title: 더치페이 초대
    description: |-
      !js
      (name, gender) => `${name}님이 더치페이를 제안합니다`
    balance:
      total: 총 청구 금액
