account:
  title: Account Transfer
  description: Someone has created this account and is transferring it to you.
  accept: Accept account
  content0: >-
    To take ownership, set up your sign-in details. This won’t create a new
    account — it just gives you access to this one.
  content1: >-
    This won’t create a new account — it will simply let you access and manage
    this one.
  conflict:
    content0: >-
      !js

      (name) => `${name}, to accept this account, you’ll be signed out of your
      current one and set up new sign-in details.`
    content1: This won’t merge accounts — you’ll switch to the new one.
  switch: Switch account
  expired:
    content: Ask the sender to generate a new link.
    description: This transfer request has expired.
    title: Transfer Expired
  og:
    tile: Take over your account on Evnly.
    description: >-
      !js

      (name) => `${name}, this account was created for you. Take ownership by
      setting up sign-in details.`
actions:
  discard: Discard
  close: Close
friends:
  app:
    description: The smart way to track who owes whom, together with friends.
  inviter:
    description: >-
      !js

      (name) => `You have been invited by ${name}. Just register or log in, and
      you’re all set`
  accept: Start Using Evn
  og:
    description: Track shared expenses, split costs, and stay in sync — together on Evnly.
    title: |-
      !js
      (name) => `Join ${name} on Evnly`
  dialog:
    title: Connect on Evnly
    description: Sign in or create an account to continue.
    accept: Connect
    decline: Not now
    content: >-
      !js

      (name) => `${name} wants to connect with you on Evnly to track shared
      expenses.`
