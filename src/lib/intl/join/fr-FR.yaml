account:
  title: Transfert de compte
  description: Quelqu’un a créé ce compte et est en train de vous le transférer.
  accept: Accepter le compte
  content0: >-
    Pour prendre la main, configurez vos identifiants de connexion. Cela ne
    créera pas un nouveau compte — cela vous donnera simplement accès à
    celui-ci.
  content1: >-
    Cela ne créera pas un nouveau compte — cela vous permettra simplement
    d'accéder à celui-ci et de le gérer.
  conflict:
    content0: >-
      !js

      (name) => `${name}, pour accepter ce compte, vous serez déconnecté de
      votre compte actuel et devrez définir de nouvelles informations de
      connexion.`
    content1: Cela ne fusionnera pas les comptes — vous passerez simplement au nouveau.
  switch: Changer de compte
  expired:
    content: Demandez à l'expéditeur de générer un nouveau lien.
    description: Cette demande de transfert a expiré.
    title: Transfert expiré
  og:
    tile: Prenez le contrôle de votre compte Evnly.
    description: >-
      !js

      (name) => `${name}, ce compte a été créé pour vous. Prenez-en possession
      en configurant vos identifiants de connexion.`
actions:
  discard: Ignorer
  close: Fermer
friends:
  app:
    description: >-
      La façon intelligente de suivre qui doit quoi à qui, ensemble avec des
      amis.
  inviter:
    description: >-
      !js

      (name) => `Vous avez été invité par ${name}. Inscrivez-vous ou
      connectez-vous, et tout est prêt !`
  accept: Commencer à utiliser Evnly
  og:
    description: >-
      Gérez vos dépenses partagées, répartissez les coûts et restez synchronisés
      — ensemble sur Evnly.
    title: |-
      !js
      (name) => `Rejoins ${name} sur Evnly`
  dialog:
    title: Connectez-vous sur Evnly
    description: Connectez-vous ou créez un compte pour continuer.
    accept: Se connecter
    decline: Pas maintenant
    content: >-
      !js

      (name) => `${name} souhaite se connecter avec vous sur Evnly pour suivre
      les dépenses partagées.`
group:
  og:
    title: |-
      !js
      (groupName) => `Rejoignez ${groupName} sur Evnly`
    description: >-
      !js

      (names) => `Partagez les dépenses avec ${new Intl.ListFormat("fr", {
      style: "long", type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `Rejoindre ${groupname}`
    join: Rejoindre
    decline: Refuser
adventures:
  og:
    title: |-
      !js
      (title) => `Rejoignez ${title} sur Evnly`
    description: >-
      Partagez les frais d’aventure et gardez un suivi équitable — ensemble sur
      Evnly.
  dialog:
    title: |-
      !js
      (title) => `Rejoindre ${title}`
    join: Rejoindre
    decline: Ignorer
    description: >-
      !js

      (name, gender) => gender === "he" ? `${name} t’invite à rejoindre
      l’aventure` : gender === "she" ? `${name} t’invite à rejoindre l’aventure`
      : `${name} t’invite à rejoindre l’aventure`
    heading: Invitation à l’aventure
receipts:
  og:
    title: |-
      !js
      (title) => `Rejoindre ${title} sur Evnly`
    description: Partagez une note et suivez qui doit quoi à qui — ensemble sur Evnly.
  dialog:
    join: Rejoindre
    decline: Refuser
    title: Invitation à l’addition
    description: |-
      !js
      (name, gender) => {
        if (gender === "he") return `${name} souhaite t'ajouter à l'addition.`;
        if (gender === "she") return `${name} souhaite t'ajouter à l'addition.`;
        return `${name} souhaite t'ajouter à l'addition.`;
      }
