account:
  title: アカウントの移行
  description: 誰かがこのアカウントを作成し、あなたに譲渡しています。
  accept: アカウントを承認
  content0: 所有権を取得するには、サインイン情報を設定してください。新しいアカウントは作成されません — このアカウントにアクセスできるようになるだけです。
  content1: 新しいアカウントは作成されません。このアカウントにアクセスして管理できるようになるだけです。
  conflict:
    content0: >-
      !js

      (name) =>
      `${name}、このアカウントを承認するには、現在のアカウントからサインアウトし、新しいサインイン情報を設定する必要があります。`
    content1: これでアカウントが統合されることはありません。新しいアカウントに切り替わります。
  switch: アカウントを切り替える
  expired:
    content: 送信者に新しいリンクを生成するよう依頼してください。
    description: この送金リクエストの有効期限が切れました。
    title: 転送の有効期限が切れました
  og:
    tile: Evnlyのアカウントを引き継ぐ。
    description: |-
      !js
      (name) => `${name}さん、このアカウントはあなたのために作成されました。サインイン情報を設定してご自身のものにしてください。`
actions:
  discard: 破棄
  close: 閉じる
friends:
  app:
    description: 友達と一緒に、誰が誰にいくら借りているかをスマートに管理する方法。
  inviter:
    description: |-
      !js
      (name) => `${name}さんから招待されています。登録またはログインするだけで、すぐにご利用いただけます。`
  accept: Evnly を使い始める
  og:
    description: 共有の支出を管理し、費用を分担し、みんなで常に連携——Evnlyで一緒に。
    title: |-
      !js
      (name) => `Evnlyで${name}に参加しよう`
  dialog:
    title: Evnlyでつながる
    description: 続行するにはサインインするかアカウントを作成してください。
    accept: 接続
    decline: 今はしない
    content: |-
      !js
      (name) => `${name}さんがEvnlyであなたとつながり、共有した支出を管理したいと考えています。`
group:
  og:
    title: |-
      !js
      (groupName) => `Evnlyで${groupName}に参加する`
    description: >-
      !js

      (names) => `${new Intl.ListFormat("ja", { style: "long", type:
      "conjunction" }).format(names)}と費用を分割する`
  dialog:
    title: |-
      !js
      (groupname) => `${groupname}に参加する`
    join: 参加する
    decline: 辞退する
adventures:
  og:
    title: |-
      !js
      (title) => `Evnlyで${title}に参加しよう`
    description: 冒険の費用をみんなで分けて、公平に管理しよう — Evnlyで一緒に。
  dialog:
    title: |-
      !js
      (title) => `${title}に参加`
    join: 参加
    decline: 無視
    description: |-
      !js
      (name, gender) => `${name}が冒険にあなたを招待しています`
    heading: 冒険への招待
receipts:
  og:
    title: |-
      !js
      (title) => `Evnlyで${title}に参加する`
    description: 領収書を分けて、誰が誰にいくら借りているかをEvnyで一緒に管理しましょう。
  dialog:
    join: 参加する
    decline: 拒否
    title: 割り勘への招待
    description: |-
      !js
      (name, gender) => `${name}さんが割り勘をしませんかと招待しています`
    balance:
      total: 合計請求額
