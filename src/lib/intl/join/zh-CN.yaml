account:
  title: 账户转移
  description: 有人创建了此账户，并正在将其转交给您。
  accept: 接受账户
  content0: 要获取所有权，请设置您的登录信息。这不会创建新账户，只会让您访问此账户。
  content1: 这不会创建新账户——只会让你访问并管理此账户。
  conflict:
    content0: |-
      !js
      (name) => `${name}，接受此账户后，您将退出当前账户并设置新的登录信息。`
    content1: 这不会合并账户—你将切换到新账户。
  switch: 切换账号
  expired:
    content: 请让发送方生成一个新链接。
    description: 该转账请求已过期。
    title: 转移已过期
  og:
    tile: 接管您在Evnly的账户。
    description: |-
      !js
      (name) => `${name}，此账户是为您创建的。请设置登录信息以获取账户所有权。`
actions:
  discard: 丢弃
  close: 关闭
friends:
  app:
    description: 与朋友们一起，智能记录谁欠谁的钱。
  inviter:
    description: |-
      !js
      (name) => `您已被${name}邀请。只需注册或登录，您就可以开始了！`
  accept: 开始使用 Evnly
  og:
    description: 跟踪共享支出、分摊费用、保持同步 —— 一起在 Evnly 上。
    title: |-
      !js
      (name) => `在Evnly上加入${name}`
  dialog:
    title: 在Evnly上连接
    description: 请登录或创建账户以继续。
    accept: 连接
    decline: 现在不要
    content: |-
      !js
      (name) => `${name} 想在 Evnly 上与你建立联系，以便一起管理共同支出。`
group:
  og:
    title: |-
      !js
      (groupName) => `在Evnly加入${groupName}`
    description: >-
      !js

      (names) => `与${new Intl.ListFormat("zh", { style: "long", type:
      "conjunction" }).format(names)}分摊费用`
  dialog:
    title: |-
      !js
      (groupname) => `加入${groupname}`
    join: 加入
    decline: 拒绝
adventures:
  og:
    title: |-
      !js
      (title) => `在Evnly加入${title}`
    description: 一起在 Evnly 平分冒险开支，轻松公平记账。
  dialog:
    title: |-
      !js
      (title) => `加入${title}`
    join: 加入
    decline: 忽略
    description: |-
      !js
      (name, gender) => `${name}邀请你加入冒险`
    heading: 冒险邀请函
receipts:
  og:
    title: |-
      !js
      (title) => `加入Evnly上的${title}`
    description: 在 Evnly 一起分账并追踪谁欠谁。
  dialog:
    join: 加入
    decline: 拒绝
    title: 邀请结账
    description: |-
      !js
      (name, gender) => {
        return `${name}希望将你添加到账单中。`;
      }
