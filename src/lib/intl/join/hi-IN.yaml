account:
  title: खाता स्थानांतरण
  description: किसी ने यह खाता बनाया है और इसे आपके नाम स्थानांतरित कर रहा है।
  accept: खाता स्वीकार करें
  content0: >-
    अधिकार प्राप्त करने के लिए, अपने साइन-इन विवरण सेट करें। इससे नया खाता नहीं
    बनेगा — यह सिर्फ आपको इसी खाते तक पहुँच देगा।
  content1: >-
    इससे नया खाता नहीं बनेगा — यह सिर्फ आपको इस खाते तक पहुँचने और इसे प्रबंधित
    करने देगा।
  conflict:
    content0: >-
      !js

      (name) => `${name}, इस खाते को स्वीकार करने के लिए, आपको अपने वर्तमान खाते
      से साइन आउट किया जाएगा और नए साइन-इन विवरण सेट करने होंगे।`
    content1: इससे खाते मर्ज नहीं होंगे — आप नए खाते पर स्विच करेंगे।
  switch: खाता बदलें
  expired:
    content: प्रेषक से नया लिंक बनाने के लिए कहें।
    description: इस ट्रांसफ़र अनुरोध की अवधि समाप्त हो गई है।
    title: स्थानांतरण की अवधि समाप्त
  og:
    tile: Evnly पर अपने खाते का नियंत्रण संभालें।
    description: >-
      !js

      (name) => `${name}, यह खाता आपके लिए बनाया गया है। साइन-इन विवरण सेट करके
      स्वामित्व लें।`
actions:
  discard: अस्वीकार करें
  close: बंद करें
friends:
  app:
    description: >-
      दोस्तों के साथ मिलकर यह जानने का स्मार्ट तरीका कि किसका किस पर कितना बकाया
      है।
  inviter:
    description: >-
      !js

      (name) => `${name} ने आपको आमंत्रित किया है। बस रजिस्टर करें या लॉग इन
      करें, और आप तैयार हैं!`
  accept: Evn का उपयोग शुरू करें
  og:
    description: >-
      साझा खर्च ट्रैक करें, खर्चों को बांटें, और हमेशा साथ रहें — Evnly पर
      मिलकर।
    title: |-
      !js
      (name) => `${name} के साथ Evnly पर जुड़ें`
  dialog:
    title: Evnly पर कनेक्ट करें
    description: जारी रखने के लिए साइन इन करें या एक खाता बनाएं।
    accept: कनेक्ट करें
    decline: अभी नहीं
    content: >-
      !js

      (name) => `${name} Evnly पर आपके साथ जुड़ना चाहता है ताकि साझा खर्च ट्रैक
      कर सकें।`
