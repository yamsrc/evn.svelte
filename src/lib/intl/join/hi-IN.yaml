account:
  title: खाता स्थानांतरण
  description: किसी ने यह खाता बनाया है और इसे आपके नाम स्थानांतरित कर रहा है।
  accept: खाता स्वीकार करें
  content0: >-
    अधिकार प्राप्त करने के लिए, अपने साइन-इन विवरण सेट करें। इससे नया खाता नहीं
    बनेगा — यह सिर्फ आपको इसी खाते तक पहुँच देगा।
  content1: >-
    इससे नया खाता नहीं बनेगा — यह सिर्फ आपको इस खाते तक पहुँचने और इसे प्रबंधित
    करने देगा।
  conflict:
    content0: >-
      !js

      (name) => `${name}, इस खाते को स्वीकार करने के लिए, आपको अपने वर्तमान खाते
      से साइन आउट किया जाएगा और नए साइन-इन विवरण सेट करने होंगे।`
    content1: इससे खाते मर्ज नहीं होंगे — आप नए खाते पर स्विच करेंगे।
  switch: खाता बदलें
  expired:
    content: प्रेषक से नया लिंक बनाने के लिए कहें।
    description: इस ट्रांसफ़र अनुरोध की अवधि समाप्त हो गई है।
    title: स्थानांतरण की अवधि समाप्त
actions:
  discard: अस्वीकार करें
  close: बंद करें
