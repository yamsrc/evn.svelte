account:
  title: खाता स्थानांतरण
  description: किसी ने यह खाता बनाया है और इसे आपके नाम स्थानांतरित कर रहा है।
  accept: खाता स्वीकार करें
  content: >-
    स्वामित्व लेने के लिए, आपको अपनी साइन-इन जानकारी सेटअप करनी होगी। इससे नया
    खाता नहीं बनेगा — यह केवल आपको इसी खाते तक पहुंचने और इसे प्रबंधित करने
    देगा।
  content0: स्वामित्व लेने के लिए, आपको अपनी साइन-इन जानकारी सेट अप करनी होगी।
  content1: >-
    इससे नया खाता नहीं बनेगा — यह सिर्फ आपको इस खाते तक पहुँचने और इसे प्रबंधित
    करने देगा।
