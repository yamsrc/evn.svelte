account:
  title: Trasferimento account
  description: Qualcuno ha creato questo account e lo sta trasferendo a te.
  accept: Accetta account
  content0: >-
    Per assumere la proprietà, imposta i tuoi dettagli di accesso. Questo non
    creerà un nuovo account — ti darà solo accesso a questo.
  content1: >-
    Questo non creerà un nuovo account — ti permetterà semplicemente di accedere
    e gestire questo.
  conflict:
    content0: >-
      !js

      (name) => `${name}, per accettare questo account, verrai disconnesso dal
      tuo attuale e dovrai impostare nuove credenziali di accesso.`
    content1: "Questo non unirà gli account: passerai semplicemente a quello nuovo."
  switch: Cambia account
  expired:
    content: Chiedi al mittente di generare un nuovo link.
    description: Questa richiesta di trasferimento è scaduta.
    title: Trasferimento scaduto
  og:
    tile: Prendi il controllo del tuo account su Evnly.
    description: >-
      !js

      (name) => `${name}, questo account è stato creato per te. Prendine
      possesso impostando i tuoi dati di accesso.`
actions:
  discard: Rifiuta
  close: Chiudi
friends:
  app:
    description: >-
      Il modo intelligente per tenere traccia di chi deve cosa a chi, insieme
      agli amici.
  inviter:
    description: >-
      !js

      (name) => `Sei stato invitato da ${name}. Registrati o accedi, ed è tutto
      pronto!`
  accept: Inizia a usare Evnly
  og:
    description: >-
      Tieni traccia delle spese condivise, dividi i costi e rimani sincronizzato
      — insieme su Evnly.
    title: |-
      !js
      (name) => `Unisciti a ${name} su Evnly`
  dialog:
    title: Connettiti su Evnly
    description: Accedi o crea un account per continuare.
    accept: Connetti
    decline: Non ora
    content: >-
      !js

      (name) => `${name} vuole connettersi con te su Evnly per tenere traccia
      delle spese condivise.`
group:
  og:
    title: |-
      !js
      (groupName) => `Unisciti a ${groupName} su Evnly`
    description: >-
      !js

      (names) => `Dividi le spese con ${new Intl.ListFormat("it", { style:
      "long", type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `Unisciti a ${groupname}`
    join: Unisciti
    decline: Rifiuta
adventures:
  og:
    title: |-
      !js
      (title) => `Unisciti a ${title} su Evnly`
    description: Dividi le spese d’avventura e tieni i conti in pari — insieme su Evnly.
  dialog:
    title: |-
      !js
      (title) => `Unisciti a ${title}`
    join: Partecipa
    decline: Ignora
    description: |-
      !js
      (name, gender) => `${name} ti invita a unirti all’avventura`
    heading: Invito all’avventura
receipts:
  og:
    title: |-
      !js
      (title) => `Unisciti a ${title} su Evnly`
    description: >-
      Dividi uno scontrino e tieni traccia di chi deve cosa a chi — tutto
      insieme su Evnly.
  dialog:
    join: Unisciti
    decline: Rifiuta
    title: Invito al conto
    description: |-
      !js
      (name, gender) => {
        return `${name} vorrebbe aggiungerti al conto.`;
      }
