account:
  title: Accountoverdracht
  description: Iemand heeft dit account aangemaakt en draagt het nu aan jou over.
  accept: Account accepteren
  content0: >-
    Om eigenaar te worden, stel je je inloggegevens in. Er wordt geen nieuw
    account aangemaakt — je krijgt alleen toegang tot dit account.
  content1: >-
    Dit maakt geen nieuw account aan — het geeft je alleen toegang tot en beheer
    over dit account.
  conflict:
    content0: >-
      !js

      (name) => `${name}, om dit account te accepteren, word je afgemeld van je
      huidige account en stel je nieuwe inloggegevens in.`
    content1: >-
      Dit voegt de accounts niet samen — je schakelt over naar het nieuwe
      account.
  switch: Van account wisselen
  expired:
    content: Vraag de afzender om een nieuwe link te genereren.
    description: Dit verzoek tot overboeking is verlopen.
    title: Overdracht verlopen
  og:
    tile: Neem de controle over je account op Evnly.
    description: >-
      !js

      (name) => `${name}, dit account is voor jou aangemaakt. Neem het in
      gebruik door je inloggegevens in te stellen.`
actions:
  discard: Afwijzen
  close: Sluiten
friends:
  app:
    description: >-
      De slimme manier om samen met vrienden bij te houden wie wat aan wie
      verschuldigd is.
  inviter:
    description: >-
      !js

      (name) => `Je bent uitgenodigd door ${name}. Registreer je of log in, en
      je bent klaar om te beginnen!`
  accept: Begin met het gebruik van Evnly
  og:
    description: >-
      Houd gezamenlijke uitgaven bij, splits de kosten en blijf op één lijn —
      samen op Evnly.
    title: |-
      !js
      (name) => `Word lid van ${name} op Evnly`
  dialog:
    title: Verbinden via Evnly
    description: Log in of maak een account aan om verder te gaan.
    accept: Verbinden
    decline: Niet nu
    content: >-
      !js

      (name) => `${name} wil graag contact maken op Evnly om gezamenlijke
      uitgaven bij te houden.`
group:
  og:
    title: |-
      !js
      (groupName) => `Word lid van ${groupName} op Evnly`
    description: >-
      !js

      (names) => `Deel uitgaven met ${new Intl.ListFormat("nl", { style: "long",
      type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `Word lid van ${groupname}`
    join: Meedoen
    decline: Weigeren
adventures:
  og:
    title: |-
      !js
      (title) => `Word lid van ${title} op Evnly`
    description: Deel de kosten van avonturen en houd samen eerlijk bij — op Evnly.
  dialog:
    title: |-
      !js
      (title) => `Word lid van ${title}`
    join: Deelnemen
    decline: Negeren
    description: |-
      !js
      (name, gender) => `${name} nodigt je uit voor het avontuur`
    heading: Uitnodiging voor het avontuur
