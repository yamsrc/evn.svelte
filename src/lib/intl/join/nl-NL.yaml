account:
  title: Accountoverdracht
  description: Iemand heeft dit account aangemaakt en draagt het nu aan jou over.
  accept: Account accepteren
  content0: >-
    Om eigenaar te worden, stel je je inloggegevens in. Er wordt geen nieuw
    account aangemaakt — je krijgt alleen toegang tot dit account.
  content1: >-
    Dit maakt geen nieuw account aan — het geeft je alleen toegang tot en beheer
    over dit account.
  conflict:
    content0: >-
      !js

      (name) => `${name}, om dit account te accepteren, word je afgemeld van je
      huidige account en stel je nieuwe inloggegevens in.`
    content1: >-
      Dit voegt de accounts niet samen — je schakelt over naar het nieuwe
      account.
  switch: Van account wisselen
  expired:
    content: Vraag de afzender om een nieuwe link te genereren.
    description: Dit verzoek tot overboeking is verlopen.
    title: Overdracht verlopen
actions:
  discard: Afwijzen
  close: Sluiten
friends:
  app:
    description: >-
      De slimme manier om samen met vrienden bij te houden wie wat aan wie
      verschuldigd is.
  inviter:
    description: >-
      !js

      (name) => `Je bent uitgenodigd door ${name}. Registreer je of log in, en
      je bent klaar om te beginnen!`
  accept: Begin met het gebruik van Evn
