account:
  title: نقل الحساب
  description: قام شخص ما بإنشاء هذا الحساب وينقله إليك الآن.
  accept: قبول الحساب
  content0: >-
    لتولي ملكية الحساب، قم بإعداد تفاصيل تسجيل الدخول الخاصة بك. لن يؤدي هذا إلى
    إنشاء حساب جديد — بل يمنحك فقط الوصول إلى هذا الحساب.
  content1: هذا لن ينشئ حسابًا جديدًا — بل سيسمح لك فقط بالوصول إلى هذا الحساب وإدارته.
  conflict:
    content0: >-
      !js

      (name) => `${name}، لقبول هذا الحساب، سيتم تسجيل خروجك من حسابك الحالي
      وستحتاج إلى إعداد تفاصيل تسجيل دخول جديدة.`
    content1: لن يؤدي هذا إلى دمج الحسابات — بل ستنتقل إلى الحساب الجديد.
  switch: تبديل الحساب
  expired:
    content: اطلب من المُرسِل إنشاء رابط جديد.
    description: انتهت صلاحية طلب التحويل هذا.
    title: انتهت صلاحية النقل
  og:
    tile: استلم التحكم في حسابك على Evnly.
    description: >-
      !js

      (name) => `${name}، تم إنشاء هذا الحساب لك. أنشئ بيانات تسجيل الدخول لتصبح
      المالك.`
actions:
  discard: تجاهل
  close: إغلاق
friends:
  app:
    description: الطريقة الذكية لمتابعة من مدين لمن، مع الأصدقاء معاً.
  inviter:
    description: >-
      !js

      (name) => `لقد تمت دعوتك من قبل ${name}. فقط سجّل أو قم بتسجيل الدخول،
      وستكون جاهزًا!`
  accept: ابدأ استخدام Evnly
  og:
    description: تابع المصاريف المشتركة، ووزّع التكاليف، وابقَ متزامنًا — معًا على Evnly.
    title: |-
      !js
      (name) => `انضم إلى ${name} على Evnly`
  dialog:
    title: تواصل على إيفنلي
    description: سجّل الدخول أو أنشئ حسابًا للمتابعة.
    accept: اتصل
    decline: ليس الآن
    content: |-
      !js
      (name) => `${name} يرغب في التواصل معك عبر Evnly لتتبع النفقات المشتركة.`
group:
  og:
    title: |-
      !js
      (groupName) => `انضم إلى ${groupName} على Evnly`
    description: >-
      !js

      (names) => `قسّم المصاريف مع ${new Intl.ListFormat("ar", { style: "long",
      type: "conjunction" }).format(names)}`
  dialog:
    title: |-
      !js
      (groupname) => `انضم إلى ${groupname}`
    join: انضم
    decline: رفض
adventures:
  og:
    title: |-
      !js
      (title) => `انضم إلى ${title} عبر Evnly`
    description: شارك مصاريف المغامرة وتابع الحسابات بالتساوي — معًا على Evnly.
  dialog:
    title: |-
      !js
      (title) => `انضم إلى ${title}`
    join: انضمام
    decline: تجاهل
    description: >-
      !js

      (name, gender) => gender === "he" ? `${name} يدعوك للانضمام إلى المغامرة`
      : gender === "she" ? `${name} تدعوك للانضمام إلى المغامرة` : `${name}
      يدعوك/تدعوك للانضمام إلى المغامرة`
    heading: دعوة إلى المغامرة
receipts:
  og:
    title: |-
      !js
      (title) => `انضم إلى ${title} على Evnly`
    description: اقسم الفاتورة وتابع من الذي يدين لمن — معًا على إيڤنلي.
  dialog:
    join: انضمام
    decline: رفض
    title: دعوة لتقسيم الفاتورة
    description: >-
      !js

      (name, gender) => gender === "he" ? `${name} يدعوك لتقسيم الفاتورة` :
      gender === "she" ? `${name} تدعوك لتقسيم الفاتورة` : `${name} يدعوك/تدعوك
      لتقسيم الفاتورة`
    balance:
      total: إجمالي الفاتورة
