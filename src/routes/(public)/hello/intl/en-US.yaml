features:
  eyebrow: Splitting Made Simple
  title1: Everything You Need
  title2: Split with ease
  body: >-
    Everything you need to split bills without stress. From quick receipt
    scanning to flexible group management, Evnly makes every step simple, fast,
    and clear — so you can focus on the moment, not the math.
  cards:
    groups:
      title: Create Groups for Any Occasion
      body: >-
        Whether it’s dinner with friends, a weekend trip, or shared household
        expenses, Evnly lets you create groups in seconds. Keep everyone
        organized, track who paid what, and make splitting simple for any
        occasion.
    invite:
      title: Add friends even if they’re not on Evnly
      body: >-
        No app? No problem. Just invite anyone with a link and they can
        instantly see their share. Splitting bills has never been easier, even
        for friends who haven’t joined Evnly yet.
    adventures:
      title: Adventures
      body: >-
        Adventures are for those who want to split things evenly—whether it’s
        traveling together, a night out at the bar, or just sharing household
        bills. Evnly makes it super easy to track, split, and settle up so
        everyone pays their fair share.
  tryItNow: Try it now
