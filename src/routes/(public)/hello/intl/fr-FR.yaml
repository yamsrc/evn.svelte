howItWorks:
  eyebrow: Étapes faciles
  title: Comment ça marche
  body: >-
    Prends juste une photo, indique qui a pris quoi d’un simple tap, et laisse
    Evnly gérer le reste. Pas de calculs, pas de prise de tête — juste un
    partage clair et équitable en quelques secondes.
  steps:
    scan: Scanne le reçu
    assign: Attribuer des articles
    payer: Sélectionne le payeur
    done: C'est fait !
