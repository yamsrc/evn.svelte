split:
  eyebrow: Ultra facile
  title: La façon la plus simple de partager les notes
  body: >-
    Transforme n’importe quelle addition en un partage clair, instantané. Avec
    Evnly, tout le monde voit sa part tout de suite — pas de calculs, pas de
    prise de tête, juste un partage de note rapide et facile.
  previewAlt: Aperçu du partage de note Evnly
features:
  eyebrow: Partager, c’est facile
  title1: Tout ce qu’il te faut
  title2: Partage facile
  body: >-
    Tout ce qu’il te faut pour partager les dépenses sans stress. Du scan rapide
    des tickets à la gestion flexible des groupes, Evnly rend chaque étape
    simple, rapide et claire — pour que tu puisses profiter du moment, sans te
    prendre la tête avec les calculs.
  cards:
    groups:
      title: Crée des groupes pour toutes les occasions
      body: >-
        Que ce soit un dîner entre amis, un week-end à plusieurs ou des dépenses
        partagées à la maison, Evnly te permet de créer des groupes en quelques
        secondes. Garde tout le monde organisé, suis qui a payé quoi, et rends
        le partage des dépenses simple pour chaque occasion.
    invite:
      title: Ajoute des amis même s’ils ne sont pas sur Evnly
      body: >-
        Pas d’appli ? Pas de souci. Invite qui tu veux par lien et ils verront
        leur part tout de suite. Partager l’addition n’a jamais été aussi
        simple, même pour les amis qui n’ont pas encore rejoint Evnly.
    adventures:
      title: Aventures
      body: >-
        Les aventures, c’est pour ceux qui veulent tout partager à parts égales
        — que ce soit un voyage ensemble, une soirée au bar ou simplement des
        dépenses à la maison. Avec Evnly, suivre, partager et régler les
        dépenses devient super simple, pour que chacun paie sa juste part.
  tryItNow: Essaye maintenant
