    title: J'adore la fonction scan du reçu
    body: >-
      Super simple et vraiment fun à utiliser. J'adore la fonction de scan de
      ticket — ça fait gagner tellement de temps et ça évite les erreurs.
    name: Sofía
    location: Madrid
  two:
    title: Parfait pour les voyages
    body: >-
      On l’a utilisé tous les jours, et ça a tout rendu tellement plus simple —
      plus besoin de noter les dépenses ni de se prendre la tête pour l’argent.
    name: Jake
    location: Berlin
  three:
    title: Scanne simplement !
    body: >-
      Fini les messages "qui me doit quoi ?" après le dîner. On scanne juste
      l'addition et tout est réglé en quelques secondes.
    name: Emma
    location: London
