split:
  eyebrow: Дуже просто
  title: Найлегший спосіб розділити рахунок
  body: >-
    Перетвори будь-який чек на простий і миттєвий розподіл. З Evnly всі одразу
    бачать свою частку — ніяких підрахунків, ніякої плутанини, лише швидкий і
    легкий поділ рахунку.
  previewAlt: Попередній перегляд поділу рахунку в Evnly
features:
  eyebrow: Ділити витрати — це просто
  title1: Усе, що тобі потрібно
  title2: Легко поділи витрати
  body: >-
    Усе, що потрібно, щоб ділити рахунки без стресу. Від миттєвого сканування
    чеків до гнучкого керування групами — з Evnly кожен крок простий, швидкий та
    зрозумілий. Насолоджуйся моментом, а не підрахунками!
  cards:
    groups:
      title: Створюй групи для будь-яких подій
      body: >-
        Чи то вечеря з друзями, поїздка на вихідні, чи спільні домашні витрати —
        з Evnly можна створити групу за секунди. Організуй усіх, відстежуй, хто
        що оплатив, і розподіляй витрати просто на будь-яку подію.
    invite:
      title: Додавай друзів, навіть якщо вони не на Evnly
      body: >-
        Немає додатку? Не проблема! Запроси кого завгодно за посиланням — і він
        одразу побачить свою частку. Ділити витрати ще ніколи не було так
        просто, навіть для друзів, які ще не приєдналися до Evnly.
    adventures:
      title: Пригоди
      body: >-
        Пригоди для тих, хто хоче ділити витрати порівну — чи це спільна
        подорож, вечір у барі, чи просто домашні витрати. З Evnly слідкувати,
        ділити й закривати рахунки легко, тож кожен платить свою справедливу
        частку.
  tryItNow: Спробуй зараз
reviews:
  eyebrow: Відгуки користувачів
  title: Відгуки
  attribution: |-
    !js
    (name, location) => `— ${name}, ${location}`
  one:
    title: Обожнюю сканування чеку
    body: >-
      Супер просто і реально приємно користуватись. Обожнюю функцію сканування
      чека — це так економить час і допомагає уникати помилок.
    name: Sofía
    location: Madrid
  two:
    title: Ідеально для подорожей
    body: >-
      Ми користувалися цим щодня, і це дуже спростило життя — більше не треба
      вести витрати у нотатках чи сваритися через гроші.
    name: Jake
    location: Berlin
  three:
    title: Просто відскануй!
    body: >-
      Нарешті ніяких повідомлень "хто мені винен?" після вечері. Просто скануємо
      чек — і все вирішується за секунду.
    name: Emma
    location: London
builtForLife:
  eyebrow: Для кожної миті, якою ти ділишся
  title: Створено для реального життя
  body: >-
    Від вечерь і вечірок до поїздок і щоденних витрат — Evnly підлаштовується
    під будь-яку ситуацію, допомагаючи легко ділити витрати з друзями, сусідами
    по квартирі чи будь-ким іншим.
