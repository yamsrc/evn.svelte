howItWorks:
  eyebrow: Passaggi facili
  title: Come funziona
  body: >-
    Basta scattare una foto, toccare per assegnare chi ha preso cosa, e lascia
    che Evnly faccia il resto. Niente calcoli, niente confusione — solo una
    divisione chiara ed equa in pochi secondi.
  steps:
    scan: Scansiona lo scontrino
    assign: Assegna articoli
    payer: Seleziona chi ha pagato
    done: Fatto!
