split:
  eyebrow: Rahisi sana
  title: Njia rahisi zaidi ya kugawana bili
  body: >-
    Geuza bili yoyote iwe rahisi kugawanya papo hapo. Ukiwa na Evnly, kila mtu
    anaona sehemu yake mara moja — hakuna hesabu, hakuna kuchanganyikiwa, ni
    kugawana bili haraka na kirahisi tu.
  previewAlt: Hakikisho la mgawanyo wa bili kwenye Evnly
features:
  eyebrow: Gawanya kwa urahisi
  title1: Kila kitu unachohitaji
  title2: Gawa mgao kwa urahisi
  body: >-
    Kila kitu unachohitaji kugawana bili bila wasiwasi. Kuanzia kuchanganua
    risiti haraka hadi kusimamia vikundi kwa urahisi, Evnly inafanya kila hatua
    iwe rahisi, haraka na wazi — ili uweze kufurahia muda, si mahesabu.
  cards:
    groups:
      title: Tengeneza vikundi kwa ajili ya tukio lolote
      body: >-
        Iwe ni chakula cha usiku na marafiki, safari ya wikendi, au gharama za
        nyumbani mliyogawana, Evnly inakuwezesha kuunda vikundi ndani ya sekunde
        chache. Weka kila mtu kwenye mpangilio, fuatilia nani amelipa nini, na
        fanya kugawana bili kuwa rahisi kwa hafla yoyote.
    invite:
      title: Ongeza marafiki hata kama hawapo kwenye Evnly
      body: >-
        Huna app? Hakuna shida! Mwalike mtu yeyote kwa link, na ataona sehemu
        yake papo hapo. Kugawana bili haijawahi kuwa rahisi hivi, hata kwa
        marafiki ambao bado hawajajiunga na Evnly.
    adventures:
      title: Matukio
      body: >-
        Mambo ya kuonja maisha ni kwa wale wanaopenda kugawana sawa — iwe ni
        safari pamoja, usiku bar, au kugawana gharama za nyumbani. Evnly
        inafanya iwe rahisi kabisa kufuatilia, kugawa na kulipia bili kwa haki
        ili kila mtu alipe sehemu yake stahiki.
  tryItNow: Jaribu sasa
