  title: Jinsi inavyofanya kazi
  body: >-
    Piga tu picha, gusa kuchagua nani alipata nini, kisha acha Evnly ifanye
    yote. Hakuna mahesabu, hakuna machanganyiko — mgawanyo wazi na wa haki ndani
    ya sekunde chache tu.
