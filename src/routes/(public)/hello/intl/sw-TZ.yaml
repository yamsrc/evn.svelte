    body: >-
      Rahisi sana na hata inafurahisha kutumia. Napenda kipengele cha kuskani
      risiti — kinaokoa muda mwingi na huepuka makosa.
    name: Sofía
    location: Madrid
  two:
    title: Inafaa kabisa kwa safari
    body: >-
      Tulitumia kila siku, na ilirahisisha kila kitu — hakuna tena kufuatilia
      matumizi kwenye noti au kubishana kuhusu pesa.
    name: Jake
    location: Berlin
  three:
    title: Changanua tu!
    body: >-
      Mwisho wa zile meseji za 'nani ananidai?' baada ya chakula cha jioni.
      Tunachofanya ni kuskan risiti na mambo yote yameisha sekunde chache tu.
    name: Emma
    location: London
