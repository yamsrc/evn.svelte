  eyebrow: Einfache Schritte
  title: So funktioniert’s
  body: >-
    Mach einfach ein Foto, tippe an, wer was hatte, und lass Evnly den Rest
    erledigen. Keine Rechnerei, keine Verwirrung – nur eine klare und faire
    Aufteilung in Sekunden.
