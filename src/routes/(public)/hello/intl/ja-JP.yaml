features:
  eyebrow: 割り勘、カンタン
  title1: 必要なものすべて
  title2: かんたん割り勘
  body: >-
    ストレスなしで割り勘するために必要なものが全部そろっています。レシートの素早いスキャンから柔軟なグループ管理まで、Evnlyならどのステップも簡単・スピーディー・分かりやすいから、計算じゃなくて今を楽しめるよ。
  cards:
    groups:
      title: どんな場面でもグループを作ろう
      body: >-
        友だちとのディナーや週末旅行、家の共同出費など、Evnlyなら数秒でグループが作れるよ。みんなを整理しやすくして、誰が何を払ったかを記録し、どんなシーンでも割り勘を簡単にしよう。
    invite:
      title: Evnlyを使っていない友達も追加できるよ
      body: >-
        アプリがなくても大丈夫！リンクで誰でも招待できて、自分の分担額がすぐに見られます。Evnlyにまだ参加していない友だちでも、割り勘がこんなに簡単になりました。
    adventures:
      title: アドベンチャー
      body: >-
        冒険は、みんなで平等に出し合いたい人のためのものです。それが一緒の旅行でも、バーでの夜遊びでも、ただ家計をシェアするだけでも。Evnlyなら、みんながきっちり割り勘できるよう、支払いの管理も分割も精算もすごく簡単です。
  tryItNow: 今すぐ試そう
