features:
  eyebrow: 分账更简单
  title1: 你需要的一切
  title2: 轻松分账
  body: 让你轻松分账，无压力。Evnly 从快速扫描小票到灵活管理小组，每一步都简单、迅速又清晰——让你专注于当下，而不是算账。
  cards:
    groups:
      title: 为各种场合创建群组
      body: 无论是好友聚餐、周末出游，还是日常家务分账，Evnly 都能让你秒建群组。让大家井井有条，轻松记录谁付了什么，让每一种场合的分账变得简单。
    invite:
      title: 即使朋友不在Evnly，也可以添加好友
      body: 没有应用程序？没问题！通过链接邀请任何人，他们立刻就能看到自己的份额。即使是还没加入Evnly的朋友，AA分账也从未如此轻松。
    adventures:
      title: 冒险
      body: >-
        冒险属于那些想要平分支出的人——无论是一起旅行、酒吧夜晚，还是简单的家庭共享开销。Evnly
        让账单记录、分摊和结算变得轻而易举，让每个人都能公平支付自己那一份。
