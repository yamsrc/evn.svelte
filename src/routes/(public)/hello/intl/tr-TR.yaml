  eyebrow: Paylaştığın her an için
  title: Gerçek hayat için tasarlandı
  body: >-
    Akşam yemeklerinden dışarıda geçirilen gecelere, gezilerden günlük
    harcamalara kadar — Evnly her duruma uyum sağlar ve masrafları
    arkadaşlarınla, ev arkadaşlarınla ya da başka biriyle kolayca bölüşmeni
    sağlar.
