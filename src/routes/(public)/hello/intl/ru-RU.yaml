features:
  eyebrow: Делить расходы просто
  title1: Всё, что тебе нужно
  title2: Делить расходы легко
  body: >-
    Всё, что нужно, чтобы делить счета без стресса. От мгновенного сканирования
    чеков до гибкого управления группой — с Evnly каждый шаг простой, быстрый и
    понятный. Наслаждайся моментом, а не вычислениями!
  cards:
    groups:
      title: Создавай группы для любых случаев
      body: >-
        Будь то ужин с друзьями, поездка на выходные или общие домашние расходы
        — с Evnly ты можешь создать группу за считанные секунды. Организуй всех,
        следи, кто что оплатил, и дели затраты легко на любой случай.
    invite:
      title: Добавляй друзей, даже если они не на Evnly
      body: >-
        Нет приложения? Не проблема! Просто пригласи по ссылке — и человек сразу
        увидит свою долю. Делиться расходами никогда не было так просто, даже
        для тех, кто ещё не присоединился к Evnly.
    adventures:
      title: Приключения
      body: >-
        Приключения для тех, кто любит делить расходы поровну — будь то
        совместная поездка, вечер в баре или просто общие бытовые траты. С Evnly
        вести учёт, делить и закрывать счета проще простого — так что каждый
        платит свою честную долю.
  tryItNow: Попробуй сейчас
