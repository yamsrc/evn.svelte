    body: >-
      بسيط جدًا وفي الواقع ممتع للاستخدام. أعشق ميزة تصوير الإيصال — توفر الكثير
      من الوقت وتمنع الأخطاء.
    name: Sofía
    location: Madrid
  two:
    title: مثالي للرحلات
    body: >-
      استخدمناه كل يوم، وسهّل علينا كل شيء — لا حاجة لتعقب المصاريف في الملاحظات
      أو الجدال على الفلوس.
    name: Jake
    location: Berlin
  three:
    title: امسح فقط!
    body: >-
      أخيرًا، ما عاد في رسائل "مين عليه لي؟" بعد العشاء. كل اللي علينا نسويّه هو
      نمسح الفاتورة وكل شيء ينتهي بثواني.
    name: Emma
    location: London
