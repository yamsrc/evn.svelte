features:
  eyebrow: تقسيم المصاريف بسهولة
  title1: كل ما تحتاج إليه
  title2: تقسيم المصاريف بسهولة
  body: >-
    كل ما تحتاجه لتقسيم الفواتير بسهولة وبدون توتر. من مسح الإيصالات بسرعة إلى
    إدارة المجموعات بمرونة، تجعل لك Evnly كل خطوة بسيطة وسريعة وواضحة — حتى تركز
    على اللحظة وتترك الحساب علينا.
  cards:
    groups:
      title: أنشئ مجموعات لأي مناسبة
      body: >-
        سواء كانت عشاء مع الأصدقاء، أو رحلة في عطلة نهاية الأسبوع، أو مصاريف
        منزلية مشتركة، يتيح لك Evnly إنشاء مجموعات في ثوانٍ. نظّم الكل بسهولة،
        وتتبع من دفع ماذا، واجعل تقاسم الفواتير بسيطًا في أي مناسبة.
    invite:
      title: أضِف الأصدقاء حتى لو لم يكونوا على Evnly
      body: >-
        ما عندك تطبيق؟ ولا يهمك! ادعُ أي شخص عبر الرابط، ويقدر يشوف حصته فورًا.
        تقسيم الفواتير صار أسهل من أي وقت، حتى لأصحابك اللي لسه ما انضموا إلى
        Evnly.
    adventures:
      title: المغامرات
      body: >-
        المغامرات للذين يريدون تقاسم المصاريف بالتساوي — سواء كانت رحلة معًا، أو
        سهرة في المقهى، أو حتى نفقات المنزل المشتركة. مع Evnly، تتبع وتقسيم
        وتسوية الفواتير يصبح سهل جدًا حتى يدفع كل شخص حصته العادلة.
  tryItNow: جرّب الآن
