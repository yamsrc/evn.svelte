split:
  eyebrow: बहुत आसान
  title: बिल बांटने का सबसे आसान तरीका
  body: >-
    किसी भी बिल को मिनटों में आसान और तुरंत बंटवारा बना दो। Evnly के साथ सबको
    अपनी राशि तुरंत दिखती है — न कोई गणना, न कोई कन्फ्यूजन, बस फटाफट और आसान बिल
    बाँटना।
  previewAlt: Evnly बिल विभाजन पूर्वावलोकन
features:
  eyebrow: बांटना हुआ आसान
  title1: जो कुछ भी तुम्हें चाहिए
  title2: आसानी से खर्च बांटो
  body: >-
    बिल्स बाँटना अब टेंशन-फ्री। त्वरित रसीद स्कैनिंग से लेकर आसान ग्रुप
    मैनेजमेंट तक, Evnly हर स्टेप को सरल, तेज़ और साफ़ बनाता है—ताकि आप पल का
    आनंद लें, गणना का नहीं।
  cards:
    groups:
      title: किसी भी मौके के लिए ग्रुप बनाओ
      body: >-
        चाहे दोस्तों के साथ डिनर हो, वीकेंड ट्रिप या घर के साझा खर्च, Evnly के
        साथ ग्रुप सेकंडों में बनाओ। सबको ऑर्गनाइज़ रखो, कौन क्या पेमेंट किया ये
        ट्रैक करो, और किसी भी मौके के लिए बिल बांटना आसान बनाओ।
    invite:
      title: दोस्त जोड़ो, चाहे वे Evnly पर न हों
      body: >-
        एप नहीं है? कोई बात नहीं! किसी को भी लिंक से बुलाओ, और वो तुरंत अपना
        शेयर देख सकते हैं। बिल बांटना कभी इतना आसान नहीं था, यहाँ तक कि उन
        दोस्तों के लिए भी जो अभी Evnly से नहीं जुड़े हैं।
    adventures:
      title: साहसिक यात्राएँ
      body: >-
        मौज-मस्ती उन सबके लिए है जो बराबर खर्च करना चाहते हैं— चाहे एक साथ
        यात्रा हो, बार में रात बिताना हो या फिर घर के साझा खर्च। Evnly के साथ
        बिल ट्रैक करना, बाँटना और सेटल करना बेहद आसान है ताकि हर कोई अपनी सही
        हिस्सेदारी दे सके।
  tryItNow: अभी आज़माएँ
reviews:
  eyebrow: लोग क्या कहते हैं
  title: समीक्षाएँ
  attribution: |-
    !js
    (name, location) => `— ${name}, ${location}`
  one:
    title: मुझे रसीद स्कैन करना बहुत पसंद है
    body: >-
      बहुत आसान है और सच में इस्तेमाल करने में मज़ा आता है। मुझे रसीद स्कैन करना
      बहुत अच्छा लगता है — इससे बहुत सारा समय बचता है और गलतियाँ नहीं होतीं।
    name: Sofía
    location: Madrid
  two:
    title: यात्राओं के लिए एकदम सही
    body: >-
      हमने इसे हर दिन इस्तेमाल किया, और इससे सब कुछ बहुत आसान हो गया — अब खर्चे
      नोट्स में लिखने या पैसों को लेकर बहस करने की जरूरत नहीं रही।
    name: Jake
    location: Berlin
  three:
    title: बस स्कैन करो!
    body: >-
      अब आखिरकार डिनर के बाद "किसने मुझे कितना देना है?" जैसे मैसेज्स नहीं आते।
      बस बिल स्कैन करो और सब कुछ सेकंडों में हिसाब हो जाता है।
    name: Emma
    location: London
